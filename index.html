            return `<span class="${s2.rec ? "rec" : ""}">${esc(s2.label)}<small>${esc(s2.amount)}</small></span><span>${esc(fmtClock(tgt))}</span><span>${esc(fmtClock(act))}</span><span class="${s2.rec ? "rec" : ""}">${diff === 0 ? "0" : (diff > 0 ? "+" : "−") + Math.abs(diff) + "s"}</span><span>${l.avg_hr ? Math.round(l.avg_hr) : ""}</span>`;
          }).join("") + `</div><div class="hint">Pace per ${SV.imperial ? "mile" : "km"}. + is slower than target, − is faster.</div></div>`;
      } else if (laps.length > 1) {
        tva = `<div class="rsec"><div class="rsec-h">Laps</div><ul class="result-laps">${laps.map((l, i) => `<li class="tnum"><span>Lap ${i + 1}</span><span>${esc(fmtDist(l.distance))}</span><span>${esc(fmtPace(l.distance, l.moving_time))}</span><span>${l.avg_hr ? "♥ " + Math.round(l.avg_hr) : ""}</span></li>`).join("")}</ul><div class="hint">The laps didn't line up with the planned steps, so they're shown as recorded.</div></div>`;
      }
    } else if (run && laps.length > 1) {
      tva = `<div class="rsec"><div class="rsec-h">Laps</div><ul class="result-laps">${laps.map((l, i) => `<li class="tnum"><span>Lap ${i + 1}</span><span>${esc(fmtDist(l.distance))}</span><span>${esc(fmtPace(l.distance, l.moving_time))}</span><span>${l.avg_hr ? "♥ " + Math.round(l.avg_hr) : ""}</span></li>`).join("")}</ul></div>`;
    }
    // splits
    const sp = run && sok ? splits(st) : [];
    const spl = sp.length > 1 ? `<div class="rsec"><div class="rsec-h">Splits</div><div class="splits tnum"><span class="th">${SV.imperial ? "Mile" : "Km"}</span><span class="th">Pace</span><span class="th">HR</span>`
      + sp.map((x, i) => `<span>${x.part ? esc((x.dist / per).toFixed(2)) : i + 1}</span><span>${esc(fmtClock(x.time / (x.dist / per)))}${unit}</span><span>${x.hr ? Math.round(x.hr) : ""}</span>`).join("") + `</div></div>` : "";
    // time in heart-rate zones: one series, bar length = minutes, labelled
    const zt = sok ? zoneTimes(st) : [], ztot = zt.reduce((x, y) => x + y, 0);
    const zones = ztot > 60 ? `<div class="rsec"><div class="rsec-h">Time in heart-rate zones${SV.zoneSrc === "max" ? " · from your max heart rate" : ""}</div><div class="zones tnum">` + zt.map((sec, i) => {
      const r = SV.zones[i], pct = Math.round((sec / ztot) * 100), range = r.max === Infinity ? r.min + "+" : r.min + "–" + r.max;
      return `<span class="zl">Z${i + 1}<small>${esc(range)}</small></span><span class="zt" title="Zone ${i + 1}: ${Math.round(sec / 60)} min (${pct}%)"><i style="width:${Math.max(pct, sec > 0 ? 2 : 0)}%"></i></span><span class="zv">${sec > 0 && sec < 60 ? "&lt;1" : Math.round(sec / 60)} min</span>`;
    }).join("") + `</div></div>` : "";
    const loading = st === "loading" && pf !== "loading" ? `<div class="hint">Loading splits and heart-rate zones…</div>` : "";
    let sErr = "";
    if (st && st.err && !(pf && pf.err)) {
      if (["approval_required", "not_in_manifest", "consent_required"].includes(st.err)) sErr = `<div class="hint">Splits and heart-rate zones need your OK for Strava. <button class="btn sm" data-act="strava-streams" data-id="${esc(a.id)}">Show them</button></div>`;
      else if (st.err === "needs_reauth") sErr = `<div class="hint">Strava needs reconnecting: You → Connections.</div>`;
      else sErr = `<div class="hint">Splits and heart-rate zones didn't load from Strava${st.retryable ? "; reopen this session to try again" : ""}.</div>`;
    }
    return `<section class="card result">
      <div class="result-head">${String(a.id).startsWith("strava:") ? `<span class="eyebrow">Your result · Strava</span><a href="https://www.strava.com/activities/${esc(String(a.id).slice(7))}" target="_blank" rel="noopener">${esc(a.name || "Open in Strava")} ↗</a>` : `<span class="eyebrow">Your result · Apple Health</span><span class="muted">${esc(a.name)}</span>`}</div>
      <div class="result-grid">${tiles}</div>
      ${tva}${spl}${zones}${loading}${perfNote(a.id, pf)}${sErr}
    </section>`;
  }

  function paintAgenda() { // the Today button shows only while today's row is off-screen
    const b = document.getElementById("ag-jump"); if (!b) return;
    const el = document.getElementById("ag-today");
    const r = el && el.getBoundingClientRect();
    b.classList.toggle("off", !r || (r.bottom > 100 && r.top < window.innerHeight - 100)); // a class, not [hidden]: the button keeps its space so the line never changes height
  }
  window.addEventListener("scroll", paintAgenda, { passive: true });
  let dayShown = todayNum();
  function onResume() { // iOS resumes home-screen apps without reloading: catch up if the date changed
    if (document.visibilityState !== "visible" || todayNum() === dayShown) return;
    dayShown = todayNum();
    if (S.route.view === "home" && homeTab() === "calendar") S.jump = "today";
    render();
  }
  document.addEventListener("visibilitychange", onResume);
  window.addEventListener("pageshow", onResume);

  /* ----- search ----- */

  /* ----- you, the welcome screen, and the coach's team ----- */
  function avatar(url, name, size) {
    const s = size || 40;
    return url ? `<img class="av" src="${esc(url)}" alt="" width="${s}" height="${s}" style="width:${s}px;height:${s}px">`
      : `<span class="av av-i" style="width:${s}px;height:${s}px;font-size:${Math.round(s * 0.38)}px" aria-hidden="true">${esc(initials(name || "?").slice(0, 2))}</span>`;
  }
  const ago = (ts) => { const m = Math.round((Date.now() - ts) / 60000); return !ts ? "never" : m < 2 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : plural(Math.round(m / 1440), "day", "days") + " ago"; };
  function weekBars(weeks) { // the last four weeks, done out of planned; this week last
    if (!weeks.some((w) => w.planned)) return "";
    return `<span class="wkbars" aria-label="${esc(weeks.map((w) => w.done + " of " + w.planned).join(", "))}">` + weeks.map((w, i) => {
      const pct = w.planned ? Math.round((w.done / w.planned) * 100) : 0;
      return `<span class="wb ${i === weeks.length - 1 ? "now" : ""}" title="Week of ${esc(fmt(dnum(w.from), { month: "short", day: "numeric" }))}: ${esc(w.done)} of ${esc(w.planned)}"><i style="height:${w.planned ? Math.max(pct, w.done ? 8 : 3) : 0}%"></i></span>`;
    }).join("") + `</span>`;
  }
  function planCard(s, pid, open) { // one plan's progress, for you or for a coach looking at you
    const pct = s.total ? Math.round((s.done / s.total) * 100) : 0, wk = s.weeks[s.weeks.length - 1] || { planned: 0, done: 0 };
    const races = s.races.length ? s.races : [];
    const head = open ? `<button class="pc-name" data-act="open-program" data-pid="${esc(pid)}">${esc(s.name)}${I.right}</button>` : `<b class="pc-name">${esc(s.name)}</b>`;
    return `<div class="pc">${head}
      <div class="bar" role="img" aria-label="${pct}% done"><i style="width:${pct}%"></i></div>
      <div class="pc-meta tnum"><span><b>${esc(s.done)}</b> of ${esc(s.total)} sessions</span>${wk.planned ? `<span>This week <b>${esc(wk.done)}/${esc(wk.planned)}</b></span>` : dnum(s.start) > todayNum() ? `<span>Starts <b>${esc(fmt(dnum(s.start)))}</b></span>` : ""}${s.due ? `<span>On time <b>${Math.round((s.done / s.due) * 100)}%</b></span>` : ""}${weekBars(s.weeks)}</div>
      ${s.next ? `<div class="hint">Next: ${esc(s.next.name)} · ${esc(fmt(dnum(s.next.date)))}</div>` : ""}
      ${races.map((r) => { const d = dnum(r.date) - todayNum(); return `<div class="hint">${I.flag} ${esc(r.name)} · ${esc(fmt(dnum(r.date)))}${d >= 0 ? " · " + (d ? plural(d, "day", "days") : "today") : ""}</div>`; }).join("")}
    </div>`;
  }
  const seg = (k, v, opts, label) => `<div class="chips" role="group" aria-label="${esc(label)}">` + opts.map(([val, txt]) => `<button class="chip" data-act="pf-set" data-k="${k}" data-v="${esc(val)}" aria-pressed="${String(v) === String(val)}">${esc(txt)}</button>`).join("") + `</div>`;
  function profileForm(pr, short) {
    const choice = (k, list, label) => seg(k, pr[k], list.map((x) => [x, x]), label);
    return `<div class="pf">
      <label class="pf-row"><span>Your name</span><input class="field" id="pf-name" data-pf="name" value="${esc(pr.name)}" placeholder="${esc((S.meView && S.meView.name) || "What should AIM call you?")}" maxlength="60" autocomplete="given-name"></label>
      <div class="pf-row"><span>Level</span>${choice("level", LEVELS, "Level")}</div>
      <div class="pf-row"><span>HYROX division</span>${choice("division", DIVISIONS, "HYROX division")}</div>
      ${short ? "" : `<label class="pf-row"><span>Race partner</span><input class="field" id="pf-partner" data-pf="partner" value="${esc(pr.partner)}" placeholder="Name, if you race doubles" maxlength="80"></label>`}
      <div class="pf-row"><span>Days a week you can train</span>${seg("days", pr.days, [1, 2, 3, 4, 5, 6, 7].map((n) => [n, String(n)]), "Days a week")}</div>
      <div class="pf-row"><span>Where you train</span>${choice("equipment", EQUIP, "Where you train")}</div>
      <label class="pf-row"><span>Your goal</span><input class="field" id="pf-goal" data-pf="goal" value="${esc(pr.goal)}" placeholder="Sub-1:05 at HYROX Miami" maxlength="200"></label>
      <label class="pf-row"><span>Max heart rate <small class="muted">optional</small></span><input class="field num" id="pf-maxHr" data-pf="maxHr" inputmode="numeric" value="${pr.maxHr || ""}" placeholder="196" maxlength="3"></label>
      ${short ? "" : `<label class="pf-row"><span>Notes for your coach <small class="muted">injuries, schedule</small></span><textarea class="field" id="pf-notes" data-pf="notes" rows="2" maxlength="600" placeholder="Left Achilles gets tight after long runs">${esc(pr.notes)}</textarea></label>`}
    </div>`;
  }
  function shareLine(pr) {
    return `<button class="edit-toggle" data-act="pf-share" aria-pressed="${pr.share}"><span class="knob"></span>Share my progress with my coach</button>
      <p class="hint">Your coach sees your profile above, your plan, how many sessions you've done each week and when you were last here. Never your Strava data or the notes on your phone.</p>`;
  }
  function stravaLine() { // AIM's own server: Strava through the server's Strava app, Apple Health through the iPhone app
    if (!window.aimStrava) return `<p class="hint">Strava isn't available in this view.</p>`;
    if (S.stravaLink == null) {
      S.stravaLink = "checking";
      window.aimStrava.status().then((s) => { S.stravaLink = s.code === "not_configured" ? "setup" : s.connected ? "on" : "off"; render(); }, () => { S.stravaLink = "off"; render(); });
    }
    const n = `${plural(SV.acts.length, "workout", "workouts")} from the last 10 weeks`;
    if (S.stravaLink === "setup") return `<p class="hint">Strava isn't set up on the AIM server yet. ${n} from Apple Health.</p>`;
    if (S.stravaLink === "off") return `<p class="hint">Not connected. ${n} from Apple Health (through the AIM iPhone app).</p><button class="btn sm" onclick="window.aimStrava.connect()">Connect Strava</button>`;
    if (S.stravaLink === "on") return `<p class="hint">Connected · ${n}, with Apple Health</p>`;
    return `<p class="hint">Checking Strava…</p>`;
  }

    let h = `<div class="you-head">${avatar(pic, name, 64)}<div><h1 class="page-title">${esc(name)}</h1>
      <div class="row you-chips"><span class="pill role">${ROLE[r]}</span>${S.isOwner ? `<span class="pill example">Owner</span>` : ""}${S.preview ? `<span class="pill draft">Previewing as a member</span>` : ""}</div></div></div>`;
    if (!S.me) return shell("you", h + `<div class="empty"><h2>Sign in to keep your progress</h2><p>Sign in to AIM, and your ticks, dates and profile follow you to every device.</p></div>`);

        ${S.preview ? "" : `<button class="sp-row nav" data-act="nav" data-v="team"><span class="badge ic">${I.team}</span><span class="sp-name">Team</span><span class="sp-pct tnum">${S.membersLoaded ? plural(n, "member", "members") : ""}</span>${I.right}</button>`}

    h += `<section class="you-sec"><h2>Heart-rate zones</h2>

      ${zs.length ? `<div class="zgrid tnum">${zs.map((z, i) => `<span>Z${i + 1}</span><span>${z.max === Infinity ? z.min + "+" : z.min + "–" + z.max} bpm</span>`).join("")}</div>` : ""}
      <p class="hint">${esc(srcLine)} Session summaries use these.</p></section>`;
    h += `<section class="you-sec"><h2>Units</h2>${seg("units", pr.units, [["", "Same as Strava"], ["mi", "Miles"], ["km", "Kilometres"]], "Units")}</section>`;

    const facts = [["Level", pr.level], ["HYROX division", pr.division], ["Race partner", pr.partner], ["Days a week", pr.days], ["Trains at", pr.equipment], ["Goal", pr.goal], ["Max heart rate", pr.maxHr], ["Notes", pr.notes]].filter((x) => x[1]);

      h += `<section class="you-sec"><h2>Plans</h2>${(m.plans || []).length ? m.plans.map((s) => planCard(s, s.pid, false)).join("") : `<p class="hint">Nothing on their Calendar yet.</p>`}</section>`;

    return shell("team", h);
  }
  function assignCard() { // on a member's Calendar: the program their coach assigned, until they add it
    const a = S.assign; if (!a || !S.me || !S.progressWritable) return "";
    const p = progOf(a.pid); if (!p) return "";
    const s = S.schedules.get(a.pid);
    if ((s && s.assignedAt === a.at) || S.hideAssign === a.at) return "";
    return `<div class="card assign"><span class="eyebrow">From your coach</span><b>${esc(p.name)}</b>
      <small>${a.anchor === "race" ? "Race day " : "Starts "}${esc(fmt(dnum(a.date), { weekday: "long", month: "short", day: "numeric" }))}</small>
      <div class="row"><button class="btn primary sm" data-act="assign-accept">${s ? "Update my Calendar" : "Add to my Calendar"}</button><button class="btn ghost sm" data-act="assign-hide">Not now</button></div></div>`;
  }
  const shouldWelcome = () => !S.admin && !!S.me && S.memberChecked && S.progressWritable && S.progressReady && !S.profile && !S.welcomed && lsGet("aim.welcomed") !== "1";

  function searchOverlay() {
    if (!S.search.open) return "";
    const raw = S.search.q, q = raw.trim().toLowerCase();
    let res;
    if (q.length >= 2) {
      const progs = orderedPrograms().filter((p) => p.name.toLowerCase().includes(q)).slice(0, 8);
      const sess = [];
      outer: for (const p of orderedPrograms()) for (const w of p.weeks) for (const d of visibleDays(w)) {
        if (d.name.toLowerCase().includes(q)) { sess.push({ p, w, d }); if (sess.length >= 40) break outer; }
      }
      res = (progs.length ? `<div class="sp-group">Programs</div>` + progs.map((p) => `<button class="sp-row" data-act="open-program" data-pid="${p.id}">${badge(p)}<span class="sp-name">${esc(p.name)}</span></button>`).join("") : "")
        + (sess.length ? `<div class="sp-group">Sessions</div>` + sess.map((x) => `<button class="sres" data-act="open-day" data-pid="${x.p.id}" data-did="${x.d.id}"><b>${esc(x.d.name)}</b><small>${esc(x.p.name)} · ${esc(x.w.name)}</small></button>`).join("") : "");
      if (!res) res = `<p class="muted search-hint">Nothing matches "${esc(raw.trim())}".</p>`;
    } else {
      res = `<p class="muted search-hint">Search ${plural(progList().length, "program", "programs")} and every session by name, like "sled", "wall balls" or "long run".</p>`;
    }
    return `<div class="search-scrim" data-act="search-close"></div><div class="search-sheet" role="dialog" aria-label="Search">
      <div class="search-bar">${I.search}<input id="search-q" class="search-in" type="search" placeholder="Search programs and sessions" value="${esc(raw)}" autocomplete="off" enterkeyhint="search"><button class="btn sm ghost" data-act="search-close">Cancel</button></div>
      <div class="search-res">${res}</div></div>`;
  }

  /* ----- program page ----- */
  function progHeader(p) {
    return `<header class="apphead"><div class="apphead-in">
      <button class="round" data-act="home" aria-label="Back">${I.left}</button>
      <span class="head-title">${badge(p)}<span>${esc(p.name)}</span></span>
      <span class="head-right">${editButton()}</span></div></header>`;
  }
  function viewProgram(pid) {
    if (S.status !== "ready") return shell("", statusScreen());
    const p = progOf(pid);
    if (!p) return shell("", `<div class="empty"><h2>Program not found</h2><p>It may have been deleted.</p><button class="btn" data-act="home">Home</button></div>`);
    const st = stats(p);
    const flat = flatDays(p).filter((d) => d.status === "published" || S.canEdit);
    const nextUp = nextSession(p) || flat[0];
    const edit = S.edit && S.canEdit;
    const sessions = p.weeks.reduce((n, w) => n + visibleDays(w).length, 0);
    const info = !edit && S.me ? todayInfo(p) : null;
    const dated = datedMap(info);

    let body;
    if (edit) {
      let weeks = "";
      p.weeks.forEach((w, wi) => {
        const ck = "w:" + w.id;
        weeks += `<section class="card week">
          <div class="week-edit">
            <input id="wn-${w.id}" class="field" data-field="w.name" data-wid="${w.id}" value="${esc(w.name)}" aria-label="Week name" maxlength="80">
            <div class="week-tools">
              <button class="icon-btn" data-act="week-up" data-wid="${w.id}" aria-label="Move week up" ${wi === 0 ? "disabled" : ""}>${I.up}</button>
              <button class="icon-btn" data-act="week-down" data-wid="${w.id}" aria-label="Move week down" ${wi === p.weeks.length - 1 ? "disabled" : ""}>${I.down}</button>
              <button class="icon-btn" data-act="week-dup" data-wid="${w.id}" aria-label="Duplicate week" title="Duplicate week">${I.copy}</button>
              <button class="icon-btn" data-act="ask" data-key="${ck}" aria-label="Delete week">${I.trash}</button>
            </div>
          </div>
          ${S.confirm === ck ? `<div style="padding:0 12px 10px"><div class="confirm"><span>Delete <b>${esc(w.name)}</b> and its ${w.days.length} ${w.days.length === 1 ? "day" : "days"}? This can't be undone.</span><span class="spacer"></span><button class="btn sm danger" data-act="week-del" data-wid="${w.id}">Delete week</button><button class="btn sm ghost" data-act="ask" data-key="">Cancel</button></div></div>` : ""}
          <div class="days">
            ${w.days.map((d, di) => dayEditRow(p, w, d, di)).join("")}
            <div class="add-row">
              <button class="btn sm" data-act="day-add" data-wid="${w.id}">${I.plus}Add day</button>
              ${w.days.length === 0 ? `<button class="btn sm" data-act="week-fill" data-wid="${w.id}">${I.plus}Add Monday–Sunday</button>` : ""}
            </div>
          </div>
        </section>`;
      });
      body = `<section class="card prog-hero"><div class="prog-fields">
          <label for="pf-name">Program name</label><input id="pf-name" class="field title-field" data-field="p.name" value="${esc(p.name)}" maxlength="120">
          <label for="pf-group">Group <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">e.g. Triathlon, Running, Strength</span></label><input id="pf-group" class="field" data-field="p.group" value="${esc(p.group)}" maxlength="60">
          <label for="pf-desc">Description</label><textarea id="pf-desc" class="field" data-field="p.description" rows="2" maxlength="2000">${esc(p.description)}</textarea>
        </div></section>
        <div class="weeks" style="margin-top:16px">${weeks}</div>
        <div class="add-row" style="padding:12px 0 0"><button class="btn" data-act="week-add">${I.plus}Add week</button></div>
        <div class="danger-zone">${S.confirm === "p:" + pid
          ? `<div class="confirm"><span>Delete <b>${esc(p.name)}</b>, all ${p.weeks.length} weeks and every workout in it? This can't be undone.</span><span class="spacer"></span><button class="btn sm danger" data-act="program-del">Delete program</button><button class="btn sm ghost" data-act="ask" data-key="">Cancel</button></div>`
          : `<button class="btn ghost danger" data-act="ask" data-key="p:${pid}">${I.trash}Delete program</button>`}</div>`;
    } else {
      let weeks = "";
      p.weeks.forEach((w) => {
        const days = visibleDays(w);
        if (!days.length && !S.canEdit) return;
        const closed = S.closedWeeks.has(w.id);
        weeks += `<section class="wk ${closed ? "closed" : ""}">
          <button class="wk-head" data-act="toggle-week" data-wid="${w.id}" aria-expanded="${!closed}"><span>${esc(w.name.toUpperCase())}</span>${I.chev}</button>
          <div class="wk-days">${days.length ? days.map((d, di) => dayRow(p, d, di, dated)).join("") : `<p class="muted" style="margin:8px 0">No days in this week yet.</p>`}</div>
        </section>`;
      });
      const sched = S.me && st.total ? datesLine(p, info) : "";
      body = `${cover(p)}
        <h1 class="ptitle">${esc(p.name)}</h1>
        <div class="psub">${esc(p.group || "Program")}${p.col === "library" ? " · Private library" : ""}${p.example ? " · Example" : ""}</div>
        ${p.description ? `<p class="pdesc">${esc(p.description)}</p>` : ""}
        ${sched}
        ${st.total ? `<h2 class="sec">Progress</h2>
          <div class="card progress-card"><div class="row" style="justify-content:space-between"><span class="tnum">${st.done} of ${st.total} complete</span><span class="muted tnum">${st.pct}%</span></div><div class="bar w"><i style="width:${st.pct}%"></i></div></div>` : ""}
        <h2 class="sec">Content</h2>
        <div class="row" style="justify-content:space-between"><span class="muted tnum">${plural(p.weeks.length, "section", "sections")} • ${plural(sessions, "session", "sessions")}</span>
          ${p.weeks.length > 1 ? `<button class="btn sm ghost" data-act="toggle-all">${p.weeks.every((w) => S.closedWeeks.has(w.id)) ? "Expand all" : "Collapse all"}</button>` : ""}</div>
        ${weeks || `<div class="empty" style="margin-top:14px"><h2>No weeks yet</h2><p>${S.canEdit ? "Turn on Edit to add the first week." : "Nothing has been added yet."}</p></div>`}`;
    }
    // a dated program continues at today's session (or the next one); an undated one after your last tick
    const due = info && info.items.length ? (info.today.find((x) => !isDone(pid, x.k)) || info.items.find((x) => x.n > info.t && !isDone(pid, x.k))) : null;
    const goTo = due ? due.k : nextUp && nextUp.id;
    const cta = !edit && goTo ? `<button class="dock-cta" data-act="open-day" data-pid="${pid}" data-did="${goTo}">${st.done ? "Continue" : "Start"}</button>` : "";
    return shell(pid, body, { header: progHeader(p), dock: dockAction(cta), cls: "prog" });
  }

  /* ----- dates card + calendar ----- */
  function schedForm(p, s) {
    const f = S.sf;
    return `<div class="sched-form">
      <div class="status-switch" role="group" aria-label="Plan from">
        <button data-act="sf-anchor" data-v="race" aria-pressed="${f.anchor === "race"}">Race day</button>
        <button data-act="sf-anchor" data-v="start" aria-pressed="${f.anchor === "start"}">Start date</button>
      </div>
      <input id="sf-date" class="field" type="date" value="${esc(f.date)}" aria-label="${f.anchor === "race" ? "Race date" : "Start date"}" style="width:auto">
      <button class="btn primary sm" data-act="sched-set" data-pid="${p.id}">${s ? "Update dates" : "Set dates"}</button>
      <button class="btn ghost sm" data-act="sched-cancel">Cancel</button>
      ${s ? `<button class="btn ghost sm danger" data-act="ask" data-key="sr:${p.id}">Reset or remove</button>` : ""}
      <p class="hint" style="width:100%;margin:0">${f.anchor === "race" ? (raceDayId(p) ? "The program's race session lands on your race day. " : "The last session lands the day before your race. ") + "Repeating a week moves the earlier weeks back, so race week stays put." : "Week 1 starts on this date; start on a Monday so sessions keep their weekdays. Repeating a week moves the later weeks forward."}${s ? " Changing the date slides your whole calendar and keeps your repeats and moves." : ""}</p>
    </div>`;
  }
  function datesLine(p, info) { // one line: when your race(s) are, or a button to add one
    const s = info && info.s, open = S.schedForm === p.id, ck = "sr:" + p.id;
    const multi = !!(s && info.races.length); // one plan, several named races: dates come with the plan
    let text = "";
    if (s && !multi && s.anchor === "race") {
      const d = info.toRace;
      text = "Race " + fmt(info.race) + " · " + (d > 1 ? d + " days" : d === 1 ? "tomorrow" : d === 0 ? "today" : "done");
    } else if (s && !multi) text = "Started " + fmt(dnum(s.date)) + (isNaN(info.end) ? "" : (info.end >= info.t ? " · ends " : " · ended ") + fmt(info.end));
    const races = multi ? info.races.map((r) => `<span class="tnum">${I.flag}${esc(r.name + " " + fmt(r.n, { month: "short", day: "numeric" }) + (r.n > info.t ? " · " + plural(r.n - info.t, "day", "days") : r.n === info.t ? " · today" : " · done"))}</span>`).join("") : "";
    const confirm = S.confirm === ck ? `<div class="confirm"><span>Rebuild the dates from scratch? Your repeats, moves and skips are undone. Ticked sessions stay ticked.</span><span class="spacer"></span><button class="btn sm danger" data-act="sched-reset" data-pid="${p.id}">Rebuild</button><button class="btn sm danger ghost" data-act="sched-clear" data-pid="${p.id}">Remove dates</button><button class="btn sm ghost" data-act="ask" data-key="">Cancel</button></div>` : "";
    const warn = info && info.after ? `<div class="warn">${plural(info.after, "session lands", "sessions land")} on or after race day. Skip them, or push earlier sessions back.</div>` : "";
    const n = tickCount(p.id), lk = "lv:" + p.id, cpk = "cp:" + p.id;
    const button = (open ? "" : multi ? `<button class="btn sm ghost" data-act="ask" data-key="${ck}">Reset or remove</button>`
      : `<button class="btn sm ${s ? "ghost" : ""}" data-act="${s ? "sched-edit" : "sched-open"}" data-pid="${p.id}">${s ? "Change dates" : I.flag + "Add race day"}</button>`)
      + (s ? `<button class="btn sm ghost danger" data-act="ask" data-key="${lk}">Leave program</button>` // unsubscribe, as on Circle
        : n ? `<button class="btn sm ghost" data-act="ask" data-key="${cpk}">Clear my progress</button>` : ""); // done before: start it again from nothing
    const leave = S.confirm === lk ? `<div class="confirm"><span>Leave <b>${esc(shortName(p))}</b>? It comes off your Calendar.${n ? " Clearing your ticks starts it fresh next time, and can't be undone." : ""}</span><span class="spacer"></span>`
      + (n ? `<button class="btn sm danger" data-act="prog-leave" data-pid="${p.id}" data-clear="1">Leave and clear ${plural(n, "tick", "ticks")}</button><button class="btn sm" data-act="prog-leave" data-pid="${p.id}" data-clear="0">Leave, keep ticks</button>`
        : `<button class="btn sm danger" data-act="prog-leave" data-pid="${p.id}" data-clear="0">Leave program</button>`)
      + `<button class="btn sm ghost" data-act="ask" data-key="">Cancel</button></div>`
      : S.confirm === cpk ? `<div class="confirm"><span>Clear all ${plural(n, "tick", "ticks")} for <b>${esc(shortName(p))}</b>? Every session goes back to not done. This can't be undone.</span><span class="spacer"></span><button class="btn sm danger" data-act="prog-clear" data-pid="${p.id}">Clear my progress</button><button class="btn sm ghost" data-act="ask" data-key="">Cancel</button></div>` : "";
    return `<div class="dates-line">${multi ? races : s ? `<span class="tnum">${I.flag}${esc(text)}</span>` : ""}${button}</div>
      ${multi && confirm ? `<div style="margin-top:10px">${confirm}</div>` : ""}
      ${leave ? `<div style="margin-top:10px">${leave}</div>` : ""}
      ${open ? `<section class="card sched-card">${s ? "" : `<p class="muted" style="margin:0">Pick your race day or the day you start. The sessions go on your Calendar. Without dates, the program stays as it is.</p>`}${schedForm(p, s)}
        ${confirm}</section>` : ""}
      ${warn}`;
  }
  function itemActions(p, x) { // the session page's Move panel
    const sk = "sk:" + x.k;
    return `<div class="item-actions card">
      <label class="row" style="gap:6px">Move to <input id="mv-${x.k}" class="field" type="date" value="${x.date}" data-act-change="item-move" data-pid="${p.id}" data-k="${x.k}" style="width:auto;padding:5px 8px"></label>
      <button class="btn sm" data-act="item-push" data-pid="${p.id}" data-k="${x.k}" data-d="1">Push back a day</button>
      <button class="btn sm" data-act="item-push" data-pid="${p.id}" data-k="${x.k}" data-d="-1">Pull forward a day</button>
      <button class="btn sm" data-act="item-repeat" data-pid="${p.id}" data-k="${x.k}">${I.copy}Repeat ${esc(x.week.name)}</button>
      ${S.confirm === sk
        ? `<span class="confirm"><span>Skip this session?</span><button class="btn sm danger" data-act="item-skip" data-pid="${p.id}" data-k="${x.k}">Skip</button><button class="btn sm ghost" data-act="ask" data-key="">Cancel</button></span>`
        : `<button class="btn sm ghost danger" data-act="ask" data-key="${sk}">Skip</button>`}
      <p class="hint" style="width:100%;margin:0">Push and pull move this session and every session after it.</p>
    </div>`;
  }

  function datedMap(info) { // first-pass date of each session, when the program is on your calendar
    const m = new Map();
    if (info) info.items.forEach((x) => { if (!x.rep && !m.has(x.did)) m.set(x.did, x.n); });
    return m;
  }
  function dayRow(p, d, di, dated) {
    const on = isDone(p.id, d.id), race = d.id === raceDayId(p), n = dated && dated.get(d.id);
    const st = (n != null ? `<span class="tnum">${esc(fmt(n))}</span>` : "") + (on ? `<span class="okc">${I.check}</span>Completed` : "") + (race ? `<span class="pill now-pill">Race day</span>` : "") + (d.status === "draft" ? '<span class="pill draft">Draft</span>' : "");
    return `<button class="srow" data-act="open-day" data-pid="${p.id}" data-did="${d.id}"><span class="srow-name">${esc(n != null ? splitDay(d.name).rest : d.name)}</span>${st ? `<span class="srow-st">${st}</span>` : ""}</button>`;
  }

  function dayEditRow(p, w, d, di) {
    const ck = "d:" + d.id;
    const weekOpts = p.weeks.map((x) => `<option value="${x.id}" ${x.id === w.id ? "selected" : ""}>${esc(x.name)}</option>`).join("");
    return `<div class="day-edit">
      <span class="tile" aria-hidden="true">${esc(tileLabel(d.name, di))}</span>
      <input id="dn-${d.id}" class="field" data-field="d.name" data-wid="${w.id}" data-did="${d.id}" value="${esc(d.name)}" aria-label="Day name" maxlength="120">
      <div class="day-tools">
        <button class="btn sm" data-act="open-day" data-pid="${p.id}" data-did="${d.id}">Write workout</button>
        <div class="status-switch" role="group" aria-label="Visibility">
          <button data-act="day-status" data-wid="${w.id}" data-did="${d.id}" data-v="published" aria-pressed="${d.status === "published"}">Live</button>
          <button data-act="day-status" data-wid="${w.id}" data-did="${d.id}" data-v="draft" aria-pressed="${d.status === "draft"}">Draft</button>
        </div>
        <button class="icon-btn" data-act="day-up" data-wid="${w.id}" data-did="${d.id}" aria-label="Move day up">${I.up}</button>
        <button class="icon-btn" data-act="day-down" data-wid="${w.id}" data-did="${d.id}" aria-label="Move day down">${I.down}</button>
        <button class="btn sm ${d.id === raceDayId(p) ? "primary" : "ghost"}" data-act="race-day" data-did="${d.id}" aria-pressed="${d.id === raceDayId(p)}" title="The session that lands on race day">${I.flag}Race day</button>
        <button class="icon-btn" data-act="day-dup" data-wid="${w.id}" data-did="${d.id}" aria-label="Duplicate day" title="Duplicate day">${I.copy}</button>
        ${p.weeks.length > 1 ? `<select id="dm-${d.id}" class="field" data-act-change="day-move" data-wid="${w.id}" data-did="${d.id}" aria-label="Move to week" style="width:auto;padding:5px 8px;font-size:13px">${weekOpts}</select>` : ""}
        <button class="icon-btn" data-act="ask" data-key="${ck}" aria-label="Delete day">${I.trash}</button>
      </div>
      ${S.confirm === ck ? `<div class="confirm" style="width:100%"><span>Delete <b>${esc(d.name)}</b> and its workout?</span><span class="spacer"></span><button class="btn sm danger" data-act="day-del" data-wid="${w.id}" data-did="${d.id}">Delete day</button><button class="btn sm ghost" data-act="ask" data-key="">Cancel</button></div>` : ""}
    </div>`;
  }

  /* ----- session view ----- */
  function rail(p, did) {
    const st = stats(p), dated = datedMap(S.me ? todayInfo(p) : null);
    let h = `<div class="rail-in">
      <div class="row"><button class="icon-btn" data-act="open-program" data-pid="${p.id}" aria-label="Back to program">${I.left}</button>
      <div class="rail-progress" style="flex:1;min-width:0"><div class="row" style="justify-content:space-between"><span class="tnum">${st.done} of ${st.total} completed</span><b class="tnum">${st.pct}%</b></div><div class="bar"><i style="width:${st.pct}%"></i></div></div></div>`;
    for (const w of p.weeks) {
      const days = visibleDays(w);
      if (!days.length) continue;
      h += `<section class="card rail-week"><h4>${esc(w.name)}</h4><div class="sub tnum">${days.length} ${days.length === 1 ? "session" : "sessions"}</div>`;
      days.forEach((d, di) => {
        const on = isDone(p.id, d.id), n = dated.get(d.id);
        h += `<button class="rail-day" data-act="open-day" data-pid="${p.id}" data-did="${d.id}" aria-current="${d.id === did}">
          <span class="tile" aria-hidden="true">${esc(n != null ? fmt(n, { weekday: "short" }).toUpperCase() : tileLabel(d.name, di))}</span>
          <span class="nm"><b>${esc(n != null ? splitDay(d.name).rest : d.name)}</b><small>${d.status === "draft" ? "Draft" : "Session"}</small></span>
          <span class="mini ${on ? "on" : ""}" aria-label="${on ? "Done" : "Not done"}">${on ? I.check : ""}</span>
        </button>`;
      });
      h += `</section>`;
    }
    return h + `</div>`;
  }

  const dayFailed = () => `<div class="empty"><h2>This workout didn't load</h2><p>Check your connection, then try again.</p><button class="btn" data-act="day-retry">Try again</button></div>`;
  function viewDay(pid, did) {
    if (S.status !== "ready") return topbar(brand) + `<main class="wrap">${statusScreen()}</main>`;
    const p = progOf(pid);
    const flat = p ? flatDays(p) : [];
    const base = did.split("~")[0];
    const idx = flat.findIndex((d) => d.id === base);
    const d = flat[idx];
    if (!p || !d) return topbar(brand) + `<main class="wrap"><div class="empty"><h2>Session not found</h2><p>It may have been moved or deleted.</p><button class="btn" data-act="${p ? "open-program" : "home"}" data-pid="${pid}">${p ? "Back to program" : "All programs"}</button></div></main>`;
    let prev = flat[idx - 1], next = flat[idx + 1];
    const info = S.me ? todayInfo(p) : null;
    const si = info ? info.items.findIndex((x) => x.k === did) : -1;
    const item = si >= 0 ? info.items[si] : null;
    if (item) { // a dated plan walks in calendar order, repeats included; dates replace the plan's own weekday names
      const nb = (x) => x && { id: x.k, name: splitDay(x.day.name).rest };
      prev = nb(info.items[si - 1]); next = nb(info.items[si + 1]);
    }
    const title = item ? splitDay(d.name).rest : d.name;
    const todayPill = item && item.n === info.t ? '<span class="pill now-pill">Today</span>' : "";
    const back = S.backTo === "home" ? `data-act="home" aria-label="Back to calendar"` : `data-act="open-program" data-pid="${pid}" aria-label="Back to program"`;
    const on = isDone(pid, did);
    const canTick = S.me && S.progressWritable && S.progressReady && d.status === "published";
    const edit = S.edit && S.canEdit;
    const key = pid + "/" + base;
    const day = S.days.get(key);

    const bar = `<header class="apphead"><div class="apphead-in">
      <button class="round" ${back}>${I.left}</button>
      <button class="round wide-only" data-act="rail" aria-label="Show sessions" title="Show sessions">${I.menu}</button>
      <span class="head-title muted"><span>${esc(p.name)}</span></span>
      <span class="head-right">
        <button class="round wide-only" data-act="open-day" data-pid="${pid}" data-did="${prev ? prev.id : ""}" aria-label="Previous session" ${prev ? "" : "disabled"}>${I.left}</button>
        <button class="round wide-only" data-act="open-day" data-pid="${pid}" data-did="${next ? next.id : ""}" aria-label="Next session" ${next ? "" : "disabled"}>${I.right}</button>
        ${canTick && !edit ? `<button class="btn wide-only ${on ? "done" : "primary"}" data-act="tick" data-pid="${pid}" data-did="${did}">${on ? I.check + "<span>Completed</span>" : "<span>Complete</span>"}</button>` : ""}
        ${editButton()}</span></div></header>`;

    let main;
    if (edit) {
      main = `<input id="day-title" class="field title-field" data-field="d.name" data-wid="${d.week.id}" data-did="${base}" value="${esc(d.name)}" aria-label="Session name" maxlength="120" style="margin-bottom:10px">
        <div class="session-meta"><span class="tnum">${esc(d.week.name)} · Session ${d.di + 1}</span>
          <div class="status-switch" role="group" aria-label="Visibility">
            <button data-act="day-status" data-wid="${d.week.id}" data-did="${base}" data-v="published" aria-pressed="${d.status === "published"}">Live</button>
            <button data-act="day-status" data-wid="${d.week.id}" data-did="${base}" data-v="draft" aria-pressed="${d.status === "draft"}">Draft</button>
          </div></div>`;
      if (!day) main += `<div class="skeleton"></div><div class="skeleton" style="width:70%"></div>`;
      else if (day.error) main += dayFailed();
      else {
        main += day.blocks.map((b, bi) => blockEditor(b, bi, day.blocks.length)).join("");
        main += `<div class="card blk-edit"><div class="hint">Add a block</div><div class="presets">
          ${PRESETS.map((t) => `<button class="btn sm" data-act="blk-add" data-title="${esc(t)}">${I.plus}${esc(t)}</button>`).join("")}
          <button class="btn sm ghost" data-act="blk-add" data-title="">${I.plus}Blank</button></div>
          <div class="hint">Format: start a line with <b>-</b> for a bullet or <b>1.</b> for a numbered step, indent to nest, wrap words in <b>**</b> for bold or <b>*</b> for italics, and paste links to demo videos (or write <b>[name](link)</b>).</div></div>`;
      }
    } else {
      // Coopah-style sessions open with a bold one-line summary ("6.00mi · avg 9:30/mi"): show it under the title
      let blocks = day ? day.blocks : [], summary = "";
      const m0 = blocks[0] && /^\s*\*\*([^*\n]{1,80})\*\*\s*$/.exec(blocks[0].body);
      if (m0 && /\d/.test(m0[1])) { summary = m0[1]; blocks = blocks.slice(1); }
      const when = item ? `${esc(fmt(item.n, { weekday: "long", month: "short", day: "numeric" }))} · ${esc(d.week.name)}${item.rep ? " repeat" : ""}` : `${esc(d.week.name)} · Session ${d.di + 1} of ${visibleDays(d.week).length}`;
      const moving = item && S.itemMenu === item.k;
      main = `<h1 class="stitle">${esc(title)}</h1>
        <div class="ssub">${esc(p.name)}</div>
        ${summary ? `<div class="ssum tnum">${esc(summary)}</div>` : ""}
        <div class="session-meta"><span class="tnum">${when}</span>${todayPill}${base === raceDayId(p) ? '<span class="pill now-pill">Race day</span>' : ""}${d.status === "draft" ? '<span class="pill draft">Draft</span>' : ""}${on ? `<span class="pill" style="background:var(--good-soft);color:var(--good)">Done</span>` : ""}
          ${item && S.progressWritable ? `<button class="btn sm ${moving ? "primary" : ""}" data-act="item-menu" data-k="${item.k}" aria-expanded="${moving}">Move</button>` : ""}</div>
        ${moving ? itemActions(p, item) : ""}
        ${item && matchOf(pid, item.k) ? resultCard(matchOf(pid, item.k), day) : ""}`;
      if (!day) main += `<div class="skeleton"></div><div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:60%"></div>`;
      else if (day.error) main += dayFailed();
      else if (!day.blocks.length) main += `<div class="empty"><h2>No workout written yet</h2><p>${S.canEdit ? "Turn on Edit to add blocks like a warm-up, the main set and a cool-down." : "Check back later."}</p>${S.canEdit ? `<button class="btn primary" data-act="toggle-edit">Write this workout</button>` : ""}</div>`;
      else main += blocks.map((b) => `<section class="block ${/^coach/i.test(b.title) ? "coach" : ""}">${b.title ? `<h2>${esc(b.title)}</h2>` : ""}<div class="prose">${renderBody(b.body)}</div></section>`).join("");
      main += `<nav class="session-foot" aria-label="Sessions">
        <button class="card nav-card" data-act="open-day" data-pid="${pid}" data-did="${prev ? prev.id : ""}" ${prev ? "" : "disabled"}><small>Previous</small><b>${prev ? esc(prev.name) : "Start of program"}</b></button>
        <button class="card nav-card next" data-act="open-day" data-pid="${pid}" data-did="${next ? next.id : ""}" ${next ? "" : "disabled"}><small>Next</small><b>${next ? esc(next.name) : "End of program"}</b></button>
      </nav>`;
    }

    const drawer = S.drawer ? `<div class="drawer-scrim" data-act="rail-close"></div><aside class="drawer" aria-label="Sessions">${rail(p, base)}</aside>` : "";
    return bar + `<div class="session-shell ${S.railHidden ? "rail-hidden" : ""}">
      <aside class="rail" aria-label="Sessions">${rail(p, base)}</aside>
      <main class="session with-dock"><div class="session-in">${main}</div></main>
    </div>${drawer}${!edit ? dockAction(canTick ? `<button class="dock-cta ${on ? "done" : ""}" data-act="tick" data-pid="${pid}" data-did="${did}">${on ? I.check + "Completed" : "Complete"}</button>` : "") : ""}`;
  }

  function blockEditor(b, bi, n) {
    const ck = "b:" + b.id;
    return `<section class="card blk-edit">
      <div class="row">
        <input id="bt-${b.id}" class="field blk-title" data-field="b.title" data-bid="${b.id}" value="${esc(b.title)}" placeholder="Block title, e.g. Warm-Up" aria-label="Block title" maxlength="120" style="flex:1 1 200px;min-width:0">
        <button class="icon-btn" data-act="blk-up" data-bid="${b.id}" aria-label="Move block up" ${bi === 0 ? "disabled" : ""}>${I.up}</button>
        <button class="icon-btn" data-act="blk-down" data-bid="${b.id}" aria-label="Move block down" ${bi === n - 1 ? "disabled" : ""}>${I.down}</button>
        <button class="icon-btn" data-act="ask" data-key="${ck}" aria-label="Delete block">${I.trash}</button>
      </div>
      ${S.confirm === ck ? `<div class="confirm"><span>Delete the <b>${esc(b.title || "untitled")}</b> block?</span><span class="spacer"></span><button class="btn sm danger" data-act="blk-del" data-bid="${b.id}">Delete block</button><button class="btn sm ghost" data-act="ask" data-key="">Cancel</button></div>` : ""}
      <div class="toolbar" role="toolbar" aria-label="Formatting">
        <button class="btn" data-fmt="bullet" data-for="bb-${b.id}" title="Bulleted list">• List</button>
        <button class="btn" data-fmt="number" data-for="bb-${b.id}" title="Numbered list">1. List</button>
        <button class="btn" data-fmt="indent" data-for="bb-${b.id}" title="Indent">Indent ${I.right}</button>
        <button class="btn" data-fmt="outdent" data-for="bb-${b.id}" title="Outdent">${I.left} Outdent</button>
        <button class="btn" data-fmt="bold" data-for="bb-${b.id}" title="Bold"><b>B</b></button>
      </div>
      <textarea id="bb-${b.id}" class="field" data-field="b.body" data-bid="${b.id}" placeholder="- 10 min easy&#10;- 4 x 400m @ 5K pace, 90 sec rest&#10;  - jog the recovery" aria-label="Block workout">${esc(b.body)}</textarea>
    </section>`;
  }

  function grow(t) { t.style.height = "auto"; t.style.height = Math.max(t.scrollHeight + 2, 48) + "px"; }
  const growAll = () => document.querySelectorAll("textarea").forEach(grow);
  try { window.matchMedia("(min-width: 900px)").addEventListener("change", () => render()); } catch (e) {}
  let resizeTimer = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(growAll, 100); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(growAll);

  /* ---------- actions ---------- */
  function findWeek(p, wid) { return p.weeks.find((w) => w.id === wid); }
  function move(arr, i, j) { if (j < 0 || j >= arr.length) return; const [x] = arr.splice(i, 1); arr.splice(j, 0, x); }
  const curProgram = () => S.programs.get(S.route.pid);

  async function copyDayDoc(pid, fromDid, toDid) {
    let src = S.days.get(pid + "/" + fromDid);
    if (!src) { try { const s = await S.db.doc(dayPath(pid, fromDid)).get(); src = s.exists ? normDay(s.data()) : null; } catch (e) { src = null; } }
    if (!src || !src.blocks.length) return;
    const copy = { blocks: src.blocks.map((b) => ({ ...b, id: uid() })) };
    S.days.set(pid + "/" + toDid, copy);
    try { await S.db.doc(dayPath(pid, toDid)).set(clone({ ...copy, updatedAt: Date.now() })); } catch (e) { writeError("programs/x", e && e.code); }
  }

  const actions = {
    home: () => { S.backTo = ""; go("home"); },
    "home-tab": (el) => { // tapping Calendar always lands on today
      if (S.route.view === "home" && homeTab() === "calendar") S.homeScroll = window.scrollY;
      S.homeTab = el.dataset.v === "programs" ? "programs" : "";
      S.jump = S.homeTab ? "" : "today"; S.backTo = "";
      if (S.route.view !== "home") go("home"); else { render(); if (S.homeTab) window.scrollTo(0, 0); }
    },
    "strava-perf": async (el) => { // one call that can ask for permission, then the card fills in
      if (!SV.mcp) return;
      const id = el.dataset.id; SV.perf.set(id, "loading"); render();
      try {
        const r = await SV.mcp.callTool(STRAVA, "get_activity_performance", { activity_id: id }, { cache: { staleTime: 300000, gcTime: 86400000 } }); SV.perf.set(id, r.payload || {});
        stravaApproved(); const act = SV.acts.find((x) => x.id === id); SV.streams.delete(id); if (act) ensureStreams(act);
      } catch (e) { SV.perf.set(id, { err: (e && e.code) || "upstream_error", retryable: !!(e && e.retryable) }); }
      render();
    },
    "strava-streams": async (el) => {
      if (!SV.mcp) return;
      const id = el.dataset.id, act = SV.acts.find((x) => x.id === id); if (!act) return;
      SV.streams.set(id, "loading"); render();
      const streams = actKind(act) === "run" ? ["time", "distance", "heart_rate", "moving"] : ["time", "heart_rate"];
      try { const r = await SV.mcp.callTool(STRAVA, "get_activity_streams", { activity_id: id, streams, resolution: 1000 }, { cache: { staleTime: 300000, gcTime: 86400000 } }); SV.streams.set(id, r.payload || {}); stravaApproved(); }
      catch (e) { SV.streams.set(id, { err: (e && e.code) || "upstream_error", retryable: !!(e && e.retryable) }); }
      render();
    },
    "strava-connect": async () => { // a watch can't ask for permission; this one call can, then the watch keeps it current
      if (!SV.mcp) return;
      try { onActs({ type: "data", result: await SV.mcp.callTool(STRAVA, "list_activities", stravaInput(), { cache: { staleTime: 300000, gcTime: 86400000 } }) }); stravaApproved(); }
      catch (e) { stravaError(e); }
    },
    "cal-today": () => { const el = document.getElementById("ag-today"); if (el) el.scrollIntoView({ block: "start" }); },
    "search-open": () => { S.search = { open: true, q: S.search.q || "" }; render(); const i = document.getElementById("search-q"); if (i) i.focus(); },
    "search-close": () => { S.search.open = false; render(); },
    "open-program": (el) => { S.backTo = ""; go("p." + el.dataset.pid); },
    "open-day": (el) => {
      if (!el.dataset.did) return;
      S.backTo = el.dataset.from === "cal" ? "home" : S.route.view === "day" ? S.backTo : ""; // prev/next keep the way back
      go("d." + el.dataset.pid + "." + el.dataset.did);
    },
    "toggle-edit": () => { S.edit = !S.edit; S.confirm = ""; lsSet("bb.edit", S.edit ? "1" : "0"); for (const p of W.keys()) flushWrite(p); render(); },
    ask: (el) => { S.confirm = el.dataset.key || ""; render(); },
    tick: (el) => toggleDone(el.dataset.pid, el.dataset.did),
    rail: () => {
      if (window.matchMedia("(min-width: 960px)").matches) { S.railHidden = !S.railHidden; lsSet("bb.rail", S.railHidden ? "0" : "1"); }
      else S.drawer = true;
      render();
    },
    "rail-close": () => { S.drawer = false; render(); },
    "toggle-week": (el) => {
      const id = el.dataset.wid;
      S.closedWeeks.has(id) ? S.closedWeeks.delete(id) : S.closedWeeks.add(id);
      lsSet("bb.closed", JSON.stringify([...S.closedWeeks])); render();
    },
    "toggle-all": () => {
      const p = curProgram(); if (!p) return;
      const allClosed = p.weeks.every((w) => S.closedWeeks.has(w.id));
      p.weeks.forEach((w) => allClosed ? S.closedWeeks.delete(w.id) : S.closedWeeks.add(w.id));
      lsSet("bb.closed", JSON.stringify([...S.closedWeeks])); render();
    },
    "new-program": () => {
      const id = uid();
      const order = Math.max(0, ...[...S.programs.values()].map((p) => p.order)) + 1;
      const p = normProgram(id, { name: "New program", order, createdAt: Date.now(), weeks: [{ id: uid(), name: "Week 1", days: [] }] });
      saveProgram(p, 0);
      if (!S.edit) { S.edit = true; lsSet("bb.edit", "1"); }
      go("p." + id);
    },
    "program-del": async () => {
      const p = curProgram(); if (!p) return;
      const ids = p.weeks.flatMap((w) => w.days.map((d) => d.id));
      const ppath = progPath(p.id), dpaths = ids.map((did) => dayPath(p.id, did));
      cancelWrite(ppath);
      S.programs.delete(p.id); S.confirm = "";
      go("home");
      try {
        await S.db.doc(ppath).delete();
        for (const path of dpaths) { cancelWrite(path); await S.db.doc(path).delete(); }
        toast("Program deleted");
      } catch (e) { writeError(ppath, e && e.code); }
    },
    "week-add": () => {
      const p = clone(curProgram()); if (!p) return;
      const last = p.weeks[p.weeks.length - 1];
      p.weeks.push({ id: uid(), name: last ? nextWeekName(last.name, p.weeks) : "Week 1", days: [] });
      saveProgram(p); render();
    },
    "week-up": (el) => { const p = clone(curProgram()); const i = p.weeks.findIndex((w) => w.id === el.dataset.wid); move(p.weeks, i, i - 1); saveProgram(p); render(); },
    "week-down": (el) => { const p = clone(curProgram()); const i = p.weeks.findIndex((w) => w.id === el.dataset.wid); move(p.weeks, i, i + 1); saveProgram(p); render(); },
    "week-del": async (el) => {
      const p = clone(curProgram()); const w = findWeek(p, el.dataset.wid); if (!w) return;
      p.weeks = p.weeks.filter((x) => x.id !== w.id); S.confirm = "";
      saveProgram(p); render();
      for (const d of w.days) { const path = dayPath(p.id, d.id); cancelWrite(path); try { await S.db.doc(path).delete(); } catch (e) {} }
    },
    "week-dup": async (el) => {
      const p = clone(curProgram()); const i = p.weeks.findIndex((w) => w.id === el.dataset.wid); if (i < 0) return;
      const src = p.weeks[i];
      const pairs = src.days.map((d) => [d.id, uid()]);
      const copy = { id: uid(), name: nextWeekName(src.name, p.weeks), days: src.days.map((d, k) => ({ ...d, id: pairs[k][1] })) };
      p.weeks.splice(i + 1, 0, copy);
      saveProgram(p); render();
      toast("Copying " + src.days.length + " days…");
      for (const [from, to] of pairs) await copyDayDoc(p.id, from, to);
      toast("Duplicated " + src.name + " as " + copy.name);
    },
    "week-fill": (el) => {
      const p = clone(curProgram()); const w = findWeek(p, el.dataset.wid); if (!w) return;
      WEEKDAYS.forEach((n) => w.days.push({ id: uid(), name: n, status: "published" }));
      saveProgram(p); render();
    },
    "day-add": (el) => {
      const p = clone(curProgram()); const w = findWeek(p, el.dataset.wid); if (!w) return;
      const d = { id: uid(), name: w.days.length < 7 ? WEEKDAYS[w.days.length] : "Day " + (w.days.length + 1), status: "published" };
      w.days.push(d); saveProgram(p); render();
      const inp = document.getElementById("dn-" + d.id); if (inp) { inp.focus(); inp.select(); }
    },
    "day-up": (el) => dayShift(el, -1),
    "day-down": (el) => dayShift(el, 1),
    "day-status": (el) => { const p = clone(curProgram()); const w = findWeek(p, el.dataset.wid); const d = w && w.days.find((x) => x.id === el.dataset.did); if (!d) return; d.status = el.dataset.v; saveProgram(p); render(); },
    "day-dup": async (el) => {
      const p = clone(curProgram()); const w = findWeek(p, el.dataset.wid); if (!w) return;
      const i = w.days.findIndex((x) => x.id === el.dataset.did); if (i < 0) return;
      const nd = { ...w.days[i], id: uid(), name: w.days[i].name + " (copy)" };
      w.days.splice(i + 1, 0, nd); saveProgram(p); render();
      await copyDayDoc(p.id, el.dataset.did, nd.id);
    },
    "day-del": async (el) => {
      const p = clone(curProgram()); const w = findWeek(p, el.dataset.wid); if (!w) return;
      w.days = w.days.filter((x) => x.id !== el.dataset.did); S.confirm = "";
      saveProgram(p);
      const path = dayPath(p.id, el.dataset.did); cancelWrite(path);
      if (S.route.view === "day" && S.route.did === el.dataset.did) go("p." + p.id); else render();
      try { await S.db.doc(path).delete(); } catch (e) {}
    },
    "sf-anchor": (el) => {
      const inp = document.getElementById("sf-date"); if (inp) S.sf.date = inp.value;
      S.sf.anchor = el.dataset.v; render();
    },
    "sched-edit": (el) => { const s = S.schedules.get(el.dataset.pid); if (!s) return; S.sf = { anchor: s.anchor, date: s.date }; S.schedForm = el.dataset.pid; S.confirm = ""; render(); },
    "sched-cancel": () => { S.schedForm = ""; render(); },
    "sched-open": (el) => { S.sf = { anchor: "race", date: "" }; S.schedForm = el.dataset.pid; render(); },
    "sched-set": (el) => {
      const pid = el.dataset.pid; const p = S.programs.get(pid); if (!p || !S.me) return;
      const inp = document.getElementById("sf-date"); const v = inp ? inp.value : "";
      if (isNaN(dnum(v))) { toast("Pick a date first."); return; }
      const s = planDates(pid, S.sf.anchor, v);
      S.schedForm = ""; S.jump = "today";
      saveSched(pid, s); render();
      toast((s.anchor === "race" ? "Planned back from " + fmt(dnum(v)) : "Planned from " + fmt(dnum(v))) + ". It's on your Calendar.");
    },
    "sched-reset": (el) => {
      const pid = el.dataset.pid; const p = S.programs.get(pid); const old = S.schedules.get(pid); if (!p || !old) return;
      S.confirm = "";
      saveSched(pid, { anchor: old.anchor, date: old.date, lead: old.lead, races: old.races, assignedAt: old.assignedAt, items: genItems(p, old.anchor, old.date, old.lead) }); render();
      toast("Calendar rebuilt");
    },
    "sched-clear": async (el) => {
      const pid = el.dataset.pid; const path = PATH.sched(pid);
      cancelWrite(path); S.schedules.delete(pid); S.confirm = ""; render();
      try { await S.db.doc(path).delete(); toast("Dates removed"); } catch (e) { writeError(path, e && e.code); }
    },
    "race-day": (el) => {
      const p = clone(curProgram()); if (!p) return;
      p.raceDay = raceDayId(p) === el.dataset.did ? "none" : el.dataset.did;
      saveProgram(p); render();
    },
    "show-past": () => { S.showPast = !S.showPast; render(); },
    "item-menu": (el) => { S.itemMenu = S.itemMenu === el.dataset.k ? "" : el.dataset.k; S.confirm = ""; render(); },
    "item-push": (el) => {
      const pid = el.dataset.pid; const s = clone(S.schedules.get(pid)); const it = s.items.find((x) => x.k === el.dataset.k); if (!it) return;
      const d = Number(el.dataset.d), from = dnum(it.date), race = s.anchor === "race" ? dnum(s.date) : NaN, p = S.programs.get(pid), rid = p ? raceDayId(p) : "";
      shiftDates(s, (x) => x.k === it.k || (dnum(x.date) >= from && !isDone(pid, x.k) && (isNaN(race) || dnum(x.date) < race) && !(x.did === rid && x.rep === 0)), d); // race day and done sessions never move
      saveSched(pid, s); render();
      toast(d > 0 ? "Moved this and later sessions back a day" : "Moved this and later sessions forward a day");
    },
    "item-repeat": (el) => {
      const pid = el.dataset.pid; const s = S.schedules.get(pid); if (!s) return;
      const r = repeatWeek(pid, el.dataset.k); if (!r) return;
      S.itemMenu = ""; render();
      toast(r.back ? "Week repeated. Earlier weeks moved back, race week stays put." : "Week repeated. Later weeks moved forward." + (s.anchor === "race" ? " Race day stays put; the program page lists anything that now lands after it." : ""));
    },
    "item-skip": (el) => {
      const pid = el.dataset.pid; const s = clone(S.schedules.get(pid));
      s.items = s.items.filter((x) => x.k !== el.dataset.k);
      S.confirm = ""; S.itemMenu = ""; saveSched(pid, s); render(); toast("Session skipped. Reset brings it back.");
    },
    "blk-add": (el) => {
      const key = S.route.pid + "/" + S.route.base; const day = S.days.get(key); if (!day || day.error) return;
      const b = { id: uid(), title: el.dataset.title || "", body: "" };
      day.blocks.push(b); saveDay(S.route.pid, S.route.base, 100); render();
      const t = document.getElementById(b.title ? "bb-" + b.id : "bt-" + b.id); if (t) t.focus();
    },
    "blk-up": (el) => blkShift(el, -1),
    "blk-down": (el) => blkShift(el, 1),
    "blk-del": (el) => {
      const key = S.route.pid + "/" + S.route.base; const day = S.days.get(key); if (!day || day.error) return;
      day.blocks = day.blocks.filter((b) => b.id !== el.dataset.bid); S.confirm = "";
      saveDay(S.route.pid, S.route.base, 100); render();
    },
  };
  function dayShift(el, dir) {
    const p = clone(curProgram()); const wi = p.weeks.findIndex((w) => w.id === el.dataset.wid); const w = p.weeks[wi]; if (!w) return;
    const i = w.days.findIndex((x) => x.id === el.dataset.did);
    const j = i + dir;
    if (j >= 0 && j < w.days.length) move(w.days, i, j);
    else if (dir < 0 && wi > 0) { const [d] = w.days.splice(i, 1); p.weeks[wi - 1].days.push(d); }            // hop to end of previous week
    else if (dir > 0 && wi < p.weeks.length - 1) { const [d] = w.days.splice(i, 1); p.weeks[wi + 1].days.unshift(d); } // hop to start of next week
    else return;
    saveProgram(p); render();
  }
  function blkShift(el, dir) {
    const key = S.route.pid + "/" + S.route.base; const day = S.days.get(key); if (!day || day.error) return;
    const i = day.blocks.findIndex((b) => b.id === el.dataset.bid); move(day.blocks, i, i + dir);
    saveDay(S.route.pid, S.route.base, 100); render();
  }


  Object.assign(actions, {
    nav: (el) => { S.backTo = ""; go(el.dataset.v); },
    "day-retry": () => { const r = S.route; S.days.delete(r.pid + "/" + r.base); S.daySubKey = ""; syncDaySub(); render(); },
    "open-member": (el) => go("member." + el.dataset.id),
    "pf-set": (el) => { // pressing the chosen option again clears it
      const k = el.dataset.k, v = el.dataset.v, cur = curProfile();
      const val = k === "days" ? Number(v) : v;
      editProfile({ [k]: String(cur[k]) === v && k !== "zones" ? "" : val });
    },
    "pf-share": () => editProfile({ share: !curProfile().share }),
    "preview-toggle": () => {
      S.preview = !S.preview; try { sessionStorage.setItem("aim.preview", S.preview ? "1" : "0"); } catch (e) {}
      S.canEdit = S.admin && !S.preview; if (S.preview) S.edit = false;
      SV.match = null; render(); toast(S.preview ? "Previewing as a member" : "Back to coach view");
    },
    "welcome-done": () => { const d = S.draft || {}; S.draft = null; saveProfile({ ...d, onboarded: Date.now() }, true); S.welcomed = true; lsSet("aim.welcomed", "1"); S.jump = "today"; go("home"); },
    "welcome-skip": () => { S.draft = null; S.welcomed = true; lsSet("aim.welcomed", "1"); S.jump = "today"; go("home"); },
    "as-anchor": (el) => { S.asAnchor = el.dataset.v === "race" ? "race" : "start"; render(); },
    "assign-save": (el) => {
      const id = el.dataset.id, pid = (document.getElementById("as-pid") || {}).value, date = (document.getElementById("as-date") || {}).value;
      if (!pid || !S.programs.has(pid)) { toast("Pick a program."); return; }
      if (isNaN(dnum(date))) { toast("Pick a date first."); return; }
      const a = { pid, anchor: S.asAnchor === "race" ? "race" : "start", date, by: S.me || "", at: Date.now() };
      S.assignOf.set(id, a); queueWrite(PATH.assign(id), () => a, 0); render();
      toast("Assigned. It shows on their Calendar to add.");
    },
    "assign-clear": async (el) => {
      const id = el.dataset.id, path = PATH.assign(id);
      cancelWrite(path); S.assignOf.set(id, null); render();
      try { await S.db.doc(path).delete(); toast("Assignment removed"); } catch (e) { writeError(path, e && e.code); }
    },
    "assign-accept": () => {
      const a = S.assign, p = a && progOf(a.pid); if (!p || !S.me) return;
      const s = planDates(a.pid, a.anchor, a.date); s.assignedAt = a.at;
      S.jump = "today"; saveSched(a.pid, s); render();
      toast(p.name + " is on your Calendar");
    },
    "assign-hide": () => { S.hideAssign = S.assign ? S.assign.at : 0; render(); },
    "prog-leave": async (el) => { // off your Calendar; with data-clear, every tick too
      const pid = el.dataset.pid, clear = el.dataset.clear === "1", p = S.programs.get(pid), name = p ? shortName(p) : "the program", path = PATH.sched(pid);
      cancelWrite(path); S.schedules.delete(pid); S.confirm = "";
      if (clear) dropTicks(pid);
      render();
      try {
        await S.db.doc(path).delete();
        if (clear) await S.db.doc(PATH.prog(pid)).delete();
        toast(clear ? "Left " + name + " and cleared its ticks" : "Left " + name + ". Your ticks stay");
      } catch (e) { writeError(path, e && e.code); }
    },
    "prog-clear": async (el) => {
      const pid = el.dataset.pid; S.confirm = ""; dropTicks(pid); render();
      try { await S.db.doc(PATH.prog(pid)).delete(); toast("Progress cleared"); } catch (e) { writeError(PATH.prog(pid), e && e.code); }
    },
    "export-data": async () => { // everything that is yours, as one file: for your records, or the move to the AIM app
      let dl = null; try { dl = await window.claude.use("downloads"); } catch (e) { dl = null; }
      if (!dl) { toast("Saving files isn't available in this view."); return; }
      const names = {}; S.schedules.forEach((s, pid) => { const p = S.programs.get(pid); if (p) names[pid] = p.name; });
      const out = {
        app: "AIM", version: AIM_VERSION, exported: new Date().toISOString(), schema: "see SCHEMA.md in the AIM project",
        profile: S.profile, prefs: S.prefs, programs: names,
        progress: Object.fromEntries([...S.progress].map(([pid, done]) => [pid, { done, noauto: S.noauto.get(pid) || {} }])),
        schedules: Object.fromEntries(S.schedules),
      };
      try { await dl.save({ filename: "aim-my-data-" + diso(todayNum()) + ".json", data: JSON.stringify(out, null, 2) }); toast("Saved"); }
      catch (e) { const c = e && e.code; if (c === "declined") return; toast(c === "rate_limited" ? "A save is already waiting for your OK." : "The file wasn't saved."); }
    },
  });

  document.addEventListener("click", (e) => {
    const f = e.target.closest("[data-fmt]");
    if (f) { e.preventDefault(); format(document.getElementById(f.dataset.for), f.dataset.fmt); return; }
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && S.search.open) { S.search.open = false; render(); return; }
    if (e.key === "Escape" && S.drawer) { S.drawer = false; render(); return; }
    const t = e.target;
    if (t.tagName === "TEXTAREA" && t.dataset.field === "b.body") {
      if (e.key === "Tab") { e.preventDefault(); format(t, e.shiftKey ? "outdent" : "indent"); }
      else if (e.key === "Enter" && !e.shiftKey && !e.metaKey && !e.ctrlKey) continueList(e, t);
    }
    if (t.tagName === "INPUT" && e.key === "Enter") t.blur();
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset.pf) { render(); return; } // saved while typing; redraw once you're done (zones follow max heart rate)
    if (el.dataset.actChange === "item-move") {
      const pid = el.dataset.pid; const s = clone(S.schedules.get(pid)); const it = s && s.items.find((x) => x.k === el.dataset.k);
      if (!it || isNaN(dnum(el.value))) return;
      it.date = el.value; saveSched(pid, s); S.itemMenu = ""; render(); toast("Moved to " + fmt(dnum(el.value)));
      return;
    }
    if (el.dataset.actChange === "day-move") {
      const p = clone(curProgram()); const from = findWeek(p, el.dataset.wid); const to = findWeek(p, el.value);
      if (!from || !to || from === to) return;
      const i = from.days.findIndex((x) => x.id === el.dataset.did); const [d] = from.days.splice(i, 1); to.days.push(d);
      saveProgram(p); render(); toast("Moved to " + to.name);
    }
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.id === "search-q") { S.search.q = el.value; render(); return; }
    if (el.dataset.pf) { if (el.tagName === "TEXTAREA") grow(el); editProfile({ [el.dataset.pf]: el.value.trim() }, true); return; }
    const f = el.dataset.field; if (!f) return;
    if (el.tagName === "TEXTAREA") grow(el);
    if (f.startsWith("p.")) {
      const p = clone(curProgram()); if (!p) return;
      p[f.slice(2)] = el.value; saveProgram(p, 600);
    } else if (f === "w.name") {
      const p = clone(curProgram()); const w = findWeek(p, el.dataset.wid); if (!w) return;
      w.name = el.value; saveProgram(p, 600);
    } else if (f === "d.name") {
      const p = clone(curProgram()); const w = findWeek(p, el.dataset.wid); const d = w && w.days.find((x) => x.id === el.dataset.did); if (!d) return;
      d.name = el.value; saveProgram(p, 600);
    } else if (f === "b.title" || f === "b.body") {
      const day = S.days.get(S.route.pid + "/" + S.route.base); const b = day && !day.error && day.blocks.find((x) => x.id === el.dataset.bid); if (!b) return;
      b[f === "b.title" ? "title" : "body"] = el.value; saveDay(S.route.pid, S.route.base);
    }
  });

  /* ---------- textarea formatting ---------- */
  function lineSpan(t) {
    const v = t.value; const s = v.lastIndexOf("\n", t.selectionStart - 1) + 1;
    let e = v.indexOf("\n", Math.max(t.selectionEnd - (t.selectionEnd > t.selectionStart && v[t.selectionEnd - 1] === "\n" ? 1 : 0), t.selectionStart));
    if (e < 0) e = v.length;
    return [s, e];
  }
  function format(t, kind) {
    if (!t) return;
    t.focus();
    const v = t.value;
    if (kind === "bold") {
      const a = t.selectionStart, b = t.selectionEnd; const sel = v.slice(a, b) || "bold";
      t.value = v.slice(0, a) + "**" + sel + "**" + v.slice(b);
      t.setSelectionRange(a + 2, a + 2 + sel.length);
    } else {
      const [s, e] = lineSpan(t);
      const lines = v.slice(s, e).split("\n");
      const marker = /^(\s*)([-*•]|\d+[.)])\s+/;
      let out;
      if (kind === "indent") out = lines.map((l) => "  " + l);
      else if (kind === "outdent") out = lines.map((l) => l.replace(/^ {1,2}|^\t/, ""));
      else if (kind === "bullet") {
        const all = lines.every((l) => /^(\s*)[-*•]\s+/.test(l) || !l.trim());
        out = lines.map((l) => !l.trim() ? l : all ? l.replace(/^(\s*)[-*•]\s+/, "$1") : l.replace(marker, "$1").replace(/^(\s*)/, "$1- "));
      } else if (kind === "number") {
        const all = lines.every((l) => /^(\s*)\d+[.)]\s+/.test(l) || !l.trim());
        let n = 0;
        out = lines.map((l) => !l.trim() ? l : all ? l.replace(/^(\s*)\d+[.)]\s+/, "$1") : l.replace(marker, "$1").replace(/^(\s*)/, "$1" + (++n) + ". "));
      }
      const rep = out.join("\n");
      t.value = v.slice(0, s) + rep + v.slice(e);
      t.setSelectionRange(s, s + rep.length);
    }
    t.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function continueList(e, t) {
    const v = t.value, pos = t.selectionStart;
    if (pos !== t.selectionEnd) return;
    const s = v.lastIndexOf("\n", pos - 1) + 1;
    const line = v.slice(s, pos);
    const m = line.match(/^(\s*)([-*•]|(\d+)([.)]))\s+(.*)$/);
    if (!m) return;
    e.preventDefault();
    let ins;
    if (!m[5].trim()) { // empty item: end the list
      t.value = v.slice(0, s) + v.slice(pos); t.setSelectionRange(s, s);
    } else {
      ins = "\n" + m[1] + (m[3] ? (Number(m[3]) + 1) + m[4] : m[2]) + " ";
      t.value = v.slice(0, pos) + ins + v.slice(pos); t.setSelectionRange(pos + ins.length, pos + ins.length);
    }
    t.dispatchEvent(new Event("input", { bubbles: true }));
  }

  /* ---------- toast ---------- */
  let toastTimer = 0;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }

  init();
})();
</script>
