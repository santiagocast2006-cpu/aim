<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F6F6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
/* AIM on its own server. The web app was written against claude.ai's artifact services (window.claude: db, user,
   mcp, downloads). This file provides the same window.claude on top of Supabase, so the page itself barely changes:
   - db:   the artifact's slash paths (programs/…, library/…, data/users/{me}/…, members/…) map to the tables in
           supabase/migrations; onSnapshot is a fetch plus live updates (Realtime), so a tick on the phone shows here.
   - user: the signed-in person; coaches can edit.
   - mcp:  "Strava" tools answered from the `workouts` table, which Apple Health (iPhone app) and Strava (server
           function) both fill, so the results card works without claude.ai's connector.
   - downloads: a normal browser download. */
(function () {
  const URL_ = "https://adsaskyhbmgplwmawwox.supabase.co";
  const KEY = "sb_publishable_dzYHmKPbKZnn-TVwXJEJ1g_KenCBJR-";
  const sb = window.supabase.createClient(URL_, KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  let session = null, coach = false;

  // ---------- errors in the shapes the page expects (e.code) ----------
  const err = (code, message) => Object.assign(new Error(message || code), { code });
  function wrap(e) {
    if (!e) return null;
    const c = String(e.code || ""), m = String(e.message || e);
    if (c === "42501" || /row-level security|permission denied/i.test(m)) return err("invalid_argument", m); // refused: the page treats this as "can't save here"
    if (/fetch|network|Failed to/i.test(m)) return err("unavailable", m);
    return err("unknown", m);
  }
  const must = ({ data, error }) => { if (error) throw wrap(error); return data; };

  // ---------- paths ----------
  const me = () => session.user.id;
  function route(path) {
    const p = String(path).split("/");
    if (p[0] === "programs" || p[0] === "library") {
      if (p.length === 1) return { t: "programs", col: p[0] };
      if (p.length === 2) return { t: "program", col: p[0], id: p[1] };
      if (p.length === 4 && p[2] === "days") return { t: "day", col: p[0], pid: p[1], did: p[3] };
    }
    if (p[0] === "data" && p[1] === "users") {
      if (p.length === 3) return { t: "mine" };
      if (p.length === 4) {
        const id = p[3];
        if (id.startsWith("prog_")) return { t: "ticks", pid: id.slice(5) };
        if (id.startsWith("sched_")) return { t: "sched", pid: id.slice(6) };
        if (id === "profile") return { t: "profile" };
        return { t: "userdoc", id };
      }
    }
    if (p[0] === "members") {
      if (p.length === 1) return { t: "members" };
      if (p.length === 2) return { t: "member", id: p[1] };
      if (p.length === 4 && p[2] === "coach" && p[3] === "plan") return { t: "assign", id: p[1] };
    }
    throw err("invalid_argument", "AIM has no place for " + path);
  }
  const TABLES = { program: "programs", programs: "programs", day: "days", ticks: "ticks", sched: "schedules", profile: "profiles",
    userdoc: "user_docs", mine: ["ticks", "schedules", "profiles", "user_docs"], member: "members", members: "members", assign: "assignments" };

  const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);
  const deepMerge = (a, b) => { for (const k in b) { if (isObj(b[k]) && isObj(a[k])) deepMerge(a[k], b[k]); else a[k] = b[k]; } return a; };

  // ---------- reads ----------
  async function ticksOf(pid) {
    const rows = must(await sb.from("ticks").select("key,done,noauto").eq("program_id", pid).limit(5000));
    if (!rows.length) return null;
    const doc = { done: {}, noauto: {} };
    rows.forEach((r) => { doc.done[r.key] = Number(r.done); doc.noauto[r.key] = Number(r.noauto); });
    return doc;
  }
  async function readDoc(r) {
    switch (r.t) {
      case "program": { const x = must(await sb.from("programs").select("doc").eq("id", r.id).eq("col", r.col).maybeSingle()); return x ? x.doc : null; }
      case "day": { const x = must(await sb.from("days").select("doc").eq("program_id", r.pid).eq("day_id", r.did).maybeSingle()); return x ? x.doc : null; }
      case "ticks": return ticksOf(r.pid);
      case "sched": { const x = must(await sb.from("schedules").select("doc").eq("program_id", r.pid).maybeSingle()); return x ? x.doc : null; }
      case "profile": { const x = must(await sb.from("profiles").select("doc").maybeSingle()); return x ? x.doc : null; }
      case "userdoc": { const x = must(await sb.from("user_docs").select("doc").eq("doc_id", r.id).maybeSingle()); return x ? x.doc : null; }
      case "member": { const x = must(await sb.from("members").select("doc").eq("user_id", r.id).maybeSingle()); return x ? x.doc : null; }
      case "assign": { const x = must(await sb.from("assignments").select("doc").eq("member_id", r.id).maybeSingle()); return x ? x.doc : null; }
    }
    throw err("invalid_argument");
  }
  async function readCollection(r) { // → Map(id → data)
    const out = new Map();
    if (r.t === "programs") must(await sb.from("programs").select("id,doc").eq("col", r.col).limit(1000)).forEach((x) => out.set(x.id, x.doc));
    else if (r.t === "members") must(await sb.from("members").select("user_id,doc").limit(1000)).forEach((x) => out.set(x.user_id, x.doc));
    else if (r.t === "mine") {
      const [ticks, scheds, prof, docs] = await Promise.all([
        sb.from("ticks").select("program_id,key,done,noauto").limit(20000), sb.from("schedules").select("program_id,doc"),
        sb.from("profiles").select("doc"), sb.from("user_docs").select("doc_id,doc")]);
      const progs = new Map();
      must(ticks).forEach((t) => { const d = progs.get(t.program_id) || { done: {}, noauto: {} }; d.done[t.key] = Number(t.done); d.noauto[t.key] = Number(t.noauto); progs.set(t.program_id, d); });
      progs.forEach((d, pid) => out.set("prog_" + pid, d));
      must(scheds).forEach((s) => out.set("sched_" + s.program_id, s.doc));
      const p = must(prof)[0]; if (p) out.set("profile", p.doc);
      must(docs).forEach((d) => out.set(d.doc_id, d.doc));
    }
    return out;
  }

  // ---------- writes ----------
  let tickCache = new Map(); // pid → {done, noauto}: lets a patch of just `done` keep each key's `noauto`
  async function writeDoc(r, data, merge) {
    const uid = me();
    if (r.t === "ticks") {
      const cur = tickCache.get(r.pid) || (await ticksOf(r.pid)) || { done: {}, noauto: {} };
      const next = merge ? deepMerge(JSON.parse(JSON.stringify(cur)), data) : { done: { ...(data.done || {}) }, noauto: { ...(data.noauto || {}) } };
      const keys = new Set([...Object.keys(data.done || {}), ...Object.keys(data.noauto || {})]);
      const rows = [...keys].map((k) => ({ user_id: uid, program_id: r.pid, key: k, done: Math.round(Number(next.done[k]) || 0), noauto: Math.round(Number(next.noauto[k]) || 0) }));
      if (rows.length) must(await sb.from("ticks").upsert(rows, { onConflict: "user_id,program_id,key" }));
      tickCache.set(r.pid, next);
      return;
    }
    if (merge) { const cur = (await readDoc(r)) || {}; data = deepMerge(cur, data); }
    switch (r.t) {
      case "program": must(await sb.from("programs").upsert({ id: r.id, col: r.col, doc: data }, { onConflict: "id" })); return;
      case "day": must(await sb.from("days").upsert({ program_id: r.pid, day_id: r.did, doc: data }, { onConflict: "program_id,day_id" })); return;
      case "sched": must(await sb.from("schedules").upsert({ user_id: uid, program_id: r.pid, doc: data }, { onConflict: "user_id,program_id" })); return;
      case "profile": must(await sb.from("profiles").upsert({ user_id: uid, doc: data }, { onConflict: "user_id" })); return;
      case "userdoc": must(await sb.from("user_docs").upsert({ user_id: uid, doc_id: r.id, doc: data }, { onConflict: "user_id,doc_id" })); return;
      case "member": if (r.id !== uid) throw err("invalid_argument"); must(await sb.from("members").upsert({ user_id: uid, doc: data }, { onConflict: "user_id" })); return;
      case "assign": must(await sb.from("assignments").upsert({ member_id: r.id, doc: data }, { onConflict: "member_id" })); return;
    }
    throw err("invalid_argument");
  }
  async function deleteDoc(r) {
    const q = {
      program: () => sb.from("programs").delete().eq("id", r.id).eq("col", r.col),
      day: () => sb.from("days").delete().eq("program_id", r.pid).eq("day_id", r.did),
      ticks: () => sb.from("ticks").delete().eq("program_id", r.pid),
      sched: () => sb.from("schedules").delete().eq("program_id", r.pid),
      profile: () => sb.from("profiles").delete().eq("user_id", me()),
      userdoc: () => sb.from("user_docs").delete().eq("doc_id", r.id),
      member: () => sb.from("members").delete().eq("user_id", r.id),
      assign: () => sb.from("assignments").delete().eq("member_id", r.id),
    }[r.t];
    if (!q) throw err("invalid_argument");
    must(await q());
    if (r.t === "ticks") tickCache.delete(r.pid);
  }

  // ---------- live updates: one Realtime channel; any change refetches the listeners on that table ----------
  const listeners = new Map(); // table → Set(fn)
  let channel = null;
  function listen(tables, fn) {
    for (const t of [].concat(tables)) { if (!listeners.has(t)) listeners.set(t, new Set()); listeners.get(t).add(fn); }
    if (!channel) {
      channel = sb.channel("aim");
      ["programs", "days", "ticks", "schedules", "profiles", "user_docs", "members", "assignments", "workouts"].forEach((table) =>
        channel.on("postgres_changes", { event: "*", schema: "public", table }, () => (listeners.get(table) || new Set()).forEach((f) => f())));
      channel.subscribe();
    }
    return () => { for (const t of [].concat(tables)) (listeners.get(t) || new Set()).delete(fn); };
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") listeners.forEach((s) => s.forEach((f) => f())); });
  const debounce = (f, ms) => { let t = 0; return () => { clearTimeout(t); t = setTimeout(f, ms); }; };

  function docRef(path) {
    const r = route(path), id = String(path).split("/").pop();
    const snap = (data) => ({ id, exists: data != null, data: () => (data == null ? undefined : JSON.parse(JSON.stringify(data))), metadata: { fromCache: false } });
    return {
      id,
      get: async () => { try { return snap(await readDoc(r)); } catch (e) { throw e.code ? e : wrap(e); } },
      set: async (data) => { try { await writeDoc(r, data, false); } catch (e) { throw e.code ? e : wrap(e); } },
      update: async (data) => { try { await writeDoc(r, data, true); } catch (e) { throw e.code ? e : wrap(e); } },
      delete: async () => { try { await deleteDoc(r); } catch (e) { throw e.code ? e : wrap(e); } },
      onSnapshot(next, onErr) {
        let last, live = true;
        const pull = debounce(async () => {
          try {
            const d = await readDoc(r), j = JSON.stringify(d);
            if (live && j !== last) { last = j; if (r.t === "ticks" && d) tickCache.set(r.pid, d); next(snap(d)); }
          } catch (e) { if (live && onErr) onErr(e.code ? e : wrap(e)); }
        }, 120);
        pull();
        const off = listen(TABLES[r.t], pull);
        return () => { live = false; off(); };
      },
    };
  }
  function collectionRef(path) {
    const r = route(path);
    return {
      onSnapshot(next, onErr) {
        let prev = new Map(), live = true;
        const pull = debounce(async () => {
          try {
            const cur = await readCollection(r), changes = [];
            cur.forEach((d, id) => {
              const j = JSON.stringify(d), was = prev.get(id);
              if (was !== j) changes.push({ type: was === undefined ? "added" : "modified", doc: { id, data: () => JSON.parse(j) } });
            });
            prev.forEach((_, id) => { if (!cur.has(id)) changes.push({ type: "removed", doc: { id, data: () => undefined } }); });
            prev = new Map([...cur].map(([id, d]) => [id, JSON.stringify(d)]));
            cur.forEach((d, id) => { if (id.startsWith("prog_")) tickCache.set(id.slice(5), d); });
            if (!live) return;
            next({ docChanges: () => changes, docs: [...cur].map(([id, d]) => ({ id, data: () => d })), metadata: { fromCache: false } });
          } catch (e) { if (live && onErr) onErr(e.code ? e : wrap(e)); }
        }, 120);
        pull();
        const off = listen(TABLES[r.t], pull);
        return () => { live = false; off(); };
      },
    };
  }
  const db = { doc: docRef, collection: collectionRef };

  // ---------- user ----------
  const user = {
    id: async () => me(),
    canEdit: async () => coach,
    isOwner: async () => coach,
    me: async () => ({ name: (session.user.email || "").split("@")[0] }),
    profiles: async () => ({}),
  };

  // ---------- workouts as the "Strava" tools the page calls ----------
  const SPORT = { run: "Run", gym: "WeightTraining", rest: "Walk" };
  const localISO = (sec) => { const d = new Date(sec * 1000), z = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };
  function dedupe(ws) { // one workout in both Health and Strava counts once: same kind, starting within 3 minutes
    const score = (w) => (w.streams ? 4 : 0) + ((w.laps || []).length ? 2 : 0) + (String(w.id).startsWith("strava:") ? 0 : 1);
    const out = [];
    [...ws].sort((a, b) => score(b) - score(a)).forEach((w) => { if (!out.some((o) => o.kind === w.kind && Math.abs(o.startedAt - w.startedAt) < 180)) out.push(w); });
    return out;
  }
  let workoutRows = null;
  async function workouts() {
    if (!workoutRows) workoutRows = must(await sb.from("workouts").select("id,doc").gte("day", new Date(Date.now() - 80 * 86400000).toISOString().slice(0, 10)).limit(1000)).map((x) => x.doc);
    return workoutRows;
  }
  listen("workouts", () => { workoutRows = null; });
  async function profile() { const x = must(await sb.from("profiles").select("doc").maybeSingle()); return (x && x.doc) || {}; }
  const TOOLS = {
    async list_activities(a) {
      const from = String((a && a.range_start) || "").slice(0, 10);
      const ws = dedupe(await workouts()).filter((w) => !from || w.date >= from).sort((x, y) => y.startedAt - x.startedAt);
      return { activities: ws.map((w) => ({
        id: w.id, name: w.name, sport_type: SPORT[w.kind] || "Other", start_local: w.date + localISO(w.startedAt).slice(10),
        summary: { distance: w.distance || 0, moving_time: w.moving || 0, relative_effort: w.effort || 0, elevation_gain: w.elevation || 0, total_calories: w.kcal || 0 },
      })), has_next_page: false };
    },
    async get_athlete_profile() { const p = await profile(); return { measurement_preference: p.units === "km" ? "Metric" : "Imperial" }; },
    async get_athlete_zones() {
      const m = Number((await profile()).maxHr) || 0;
      if (!m) return { heart_rate_zones: [] };
      const b = [0.65, 0.81, 0.89, 0.97].map((x) => Math.round(m * x));
      return { heart_rate_zones: [{ min: 0, max: b[0] }, { min: b[0] + 1, max: b[1] }, { min: b[1] + 1, max: b[2] }, { min: b[2] + 1, max: b[3] }, { min: b[3] + 1 }] };
    },
    async get_activity_performance(a) {
      const w = (await workouts()).find((x) => x.id === String(a.activity_id));
      if (!w) throw err("not_found");
      return { has_heartrate: w.avgHR != null, average_heartrate: w.avgHR, max_heartrate: w.maxHR, calories: w.kcal,
        laps: (w.laps || []).map((l) => ({ moving_time: l.moving, elapsed_time: l.moving, distance: l.distance, avg_hr: l.avgHR })) };
    },
    async get_activity_streams(a) {
      const w = (await workouts()).find((x) => x.id === String(a.activity_id));
      const s = (w && w.streams) || {};
      return { time: s.time, distance: s.distance, heart_rate: s.heartRate, moving: s.moving };
    },
  };
  const mcp = {
    async callTool(server, tool, args) {
      if (!TOOLS[tool]) throw err("not_in_manifest");
      return { payload: await TOOLS[tool](args), cache: { storedAt: Date.now() } };
    },
    watchTool(server, tool, args, cb, opts) {
      const run = () => mcp.callTool(server, tool, args).then((result) => cb({ type: "data", result }), (error) => cb({ type: "error", error }));
      run();
      listen("workouts", debounce(run, 300));
      if (opts && opts.refetchInterval) setInterval(run, opts.refetchInterval);
    },
    invalidate: async () => {},
  };

  // ---------- Strava: connect, and pull new activities in the background ----------
  window.aimStrava = {
    async status() { const { data } = await sb.functions.invoke("strava", { body: { action: "status" } }); return data || {}; },
    async connect() {
      const { data, error } = await sb.functions.invoke("strava", { body: { action: "connect", return_to: location.origin + location.pathname } });
      if (error || !data || !data.url) throw err((data && data.code) || "unavailable");
      location.href = data.url;
    },
    async sync() { const { data } = await sb.functions.invoke("strava", { body: { action: "sync" } }); return data || {}; },
  };

  const downloads = { save: async ({ filename, data }) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  } };

  // ---------- sign-in: the page waits behind this until someone is signed in ----------
  let signedIn;
  const ready = new Promise((res) => { signedIn = res; });
  window.aimSignOut = async () => { await sb.auth.signOut(); location.reload(); };

  function gate() {
    const el = document.createElement("div");
    el.id = "aim-gate";
    el.innerHTML = `<style>
      #aim-gate { position: fixed; inset: 0; z-index: 1000; background: var(--bg); color: var(--fg); display: grid; place-items: start center; overflow: auto; }
      #aim-gate form { width: min(420px, 100%); padding: 72px 24px 40px; display: grid; gap: 14px; }
      #aim-gate h1 { font: 800 56px/1 var(--font-display); letter-spacing: -.02em; margin: 0; }
      #aim-gate p { color: var(--muted); margin: 0 0 12px; }
      #aim-gate label { display: grid; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
      #aim-gate input { font: inherit; font-size: 17px; text-transform: none; letter-spacing: 0; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; }
      #aim-gate .go { border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); padding: 15px; font: 700 17px var(--font-body); margin-top: 8px; }
      #aim-gate .note { font-size: 14px; text-align: center; margin: 4px 0 0; }
      #aim-gate .msg { color: var(--muted); font-size: 14px; min-height: 1em; }
    </style>
    <form autocomplete="on"><h1>AIM</h1><p class="sub">Sign in to your training</p>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="1"></label>
      <div class="msg" role="status"></div>
      <button class="go" type="submit">Sign in</button>
      <p class="note">AIM is invite-only: your coach gives you an account.</p></form>`;
    document.body.appendChild(el);
    const f = el.querySelector("form"), msg = el.querySelector(".msg"), go = el.querySelector(".go");
    f.onsubmit = async (e) => { // accounts are made by the coach (sign-up is off on the server), so this only signs in
      e.preventDefault(); go.disabled = true; msg.textContent = "";
      const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim().toLowerCase(), password: f.password.value });
      go.disabled = false;
      if (error) msg.textContent = error.message;
    };
    return el;
  }

  async function begin(s) {
    session = s;
    const r = await sb.from("roles").select("role").maybeSingle();
    coach = !!(r.data && r.data.role === "coach");
    document.getElementById("aim-gate")?.remove();
    signedIn();
    const back = new URLSearchParams(location.search).get("strava"); // coming back from Strava's sign-in page
    if (back) {
      history.replaceState(null, "", location.pathname + location.hash);
      if (back !== "connected") setTimeout(() => alert(back === "no_activities" ? "Strava needs access to your activities. Connect again and leave that box ticked." : "Strava wasn't connected."), 300);
    }
    window.aimStrava.sync().catch(() => {}); // new Strava activities land in `workouts`; the live update redraws
  }
  sb.auth.getSession().then(({ data }) => {
    if (data.session) begin(data.session);
    else {
      const g = () => gate();
      document.body ? g() : document.addEventListener("DOMContentLoaded", g);
      sb.auth.onAuthStateChange((ev, s) => { if (s && !session) begin(s); });
    }
  });

  window.claude = {
    use: async (name) => {
      await ready;
      return { db, user, mcp, downloads }[name] || null;
    },
  };
})();

</script>
<title>AIM</title>
<style>
/* Layout: a course shell. Program list → program home (progress + week accordions) → session view with a curriculum rail (drawer on phones). */
:root {
  --bg: #F6F6F7;
  --surface: #FFFFFF;
  --surface-2: #EDEDEF;
  --line: #DEDEE1;
  --fg: #111113;
  --muted: #61626A;
  --accent: #111113;          /* monochrome: ink on paper, white on black */
  --accent-ink: #FFFFFF;
  --accent-soft: #EAEAEC;
  --good: #22804F;
  --good-soft: #E1F2E8;
  --draft: #82661A;
  --draft-soft: #F5EED6;
  --danger: #B42318;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 12px;
  --r-sm: 7px;
  --shadow: 0 1px 2px rgba(20, 24, 28, .06), 0 2px 8px rgba(20, 24, 28, .04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090A; --surface: #141416; --surface-2: #1E1E21; --line: #2A2A2E; --fg: #F2F2F3; --muted: #9B9BA3;
    --accent: #F2F2F3; --accent-ink: #09090A; --accent-soft: #2A2A2F; --good: #5BC489; --good-soft: #15301F;
    --draft: #E3C56B; --draft-soft: #332A10; --danger: #F97066;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090A; --surface: #141416; --surface-2: #1E1E21; --line: #2A2A2E; --fg: #F2F2F3; --muted: #9B9BA3;
  --accent: #F2F2F3; --accent-ink: #09090A; --accent-soft: #2A2A2F; --good: #5BC489; --good-soft: #15301F;
  --draft: #E3C56B; --draft-soft: #332A10; --danger: #F97066;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- shared bits ---------- */
.wrap { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.display { font-family: var(--font-display); font-weight: 800; letter-spacing: -.015em; line-height: 1.05; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.done { background: var(--good-soft); border-color: transparent; color: var(--good); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn svg, .btn svg { width: 16px; height: 16px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; }
.pill.draft { background: var(--draft-soft); color: var(--draft); }
.pill.example { background: var(--accent-soft); color: var(--accent); }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); border-radius: inherit; transition: width .3s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.field { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 8px 10px; }
.field:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field.title-field { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.1; padding: 6px 10px; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 8px; padding: 9px 16px; min-height: 54px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: .01em; color: var(--fg); text-decoration: none; background: none; border: 0; padding: 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.brand-mark svg { width: 16px; height: 16px; }
.crumb { flex: 0 1 auto; min-width: 0; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; padding: 4px 6px; border-radius: 6px; text-align: left; }
.crumb:hover { background: var(--surface-2); }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.edit-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); padding: 5px 10px 5px 6px; border-radius: 999px; }
.edit-toggle .knob { width: 30px; height: 18px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background .15s; }
.edit-toggle .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.edit-toggle[aria-pressed="true"] .knob { background: var(--accent); border-color: var(--accent); }
.edit-toggle[aria-pressed="true"] .knob::after { transform: translateX(12px); background: var(--accent-ink); }

/* ---------- home ---------- */
.home-head { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; margin-block: 8px 22px; }
.home-head h1 { font-size: clamp(34px, 7vw, 46px); }
.group { display: grid; gap: 10px; margin-bottom: 28px; }
.prog-card { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; text-align: left; width: 100%; color: inherit; }
.prog-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.prog-tile { width: 46px; height: 46px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.prog-name { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.1; }
.prog-meta { font-size: 14px; color: var(--muted); }
.prog-pct { font-size: 13px; font-weight: 700; color: var(--muted); }
.prog-card .bar { display: block; margin-top: 8px; max-width: 260px; }
.prog-meta { display: block; }
.empty { text-align: center; padding: 48px 20px; border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--surface); }
.empty h2 { font-family: var(--font-display); font-size: 26px; margin-bottom: 6px; }
.empty p { margin: 0 auto 16px; max-width: 46ch; color: var(--muted); }
.diagram { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; font-size: 13px; font-weight: 600; color: var(--muted); }
.diagram svg { width: 14px; height: 14px; flex: none; }
.diagram span { border: 1px solid var(--line); background: var(--surface-2); padding: 4px 10px; border-radius: 999px; }

/* ---------- program home ---------- */
.prog-hero { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; padding: 18px 20px; margin-bottom: 18px; }
.prog-hero h1 { font-size: clamp(30px, 6vw, 40px); }
.prog-hero p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.prog-hero > div { min-width: 0; flex: 1 1 280px; }
.section-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 26px 0 10px; }
.progress-card { padding: 16px 18px; display: grid; gap: 10px; }
.progress-card .row { justify-content: space-between; font-size: 15px; }
.content-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
.content-head h2 { font-family: var(--font-display); font-size: 22px; color: var(--fg); margin: 0; }
.weeks { display: grid; gap: 12px; }
.week { overflow: hidden; }
.week-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; width: 100%; border: 0; background: transparent; text-align: left; }
.week-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .01em; flex: 1; min-width: 0; }
.week-head .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
.chev { width: 16px; height: 16px; transition: transform .15s; color: var(--muted); flex: none; }
.week.closed .chev { transform: rotate(-90deg); }
.week.closed .days { display: none; }
.days { border-top: 1px solid var(--line); padding: 4px 8px 8px; }
.day-row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 9px; }
.day-row:hover { background: var(--surface-2); }
.day-open { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; }
.day-name { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile { width: 44px; height: 32px; border-radius: 7px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .03em; background: var(--surface-2); color: var(--muted); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); flex: none; display: grid; place-items: center; padding: 0; color: transparent; }
.check:hover { border-color: var(--good); }
.check.on { background: var(--good); border-color: var(--good); color: var(--surface); }
.check svg { width: 13px; height: 13px; }
.check[disabled] { cursor: default; }
.week-tools, .day-tools { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.week-edit { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex-wrap: wrap; }
.week-edit .field { flex: 1 1 180px; font-family: var(--font-display); font-weight: 700; font-size: 18px; padding: 5px 9px; min-width: 0; }
.day-edit { display: flex; align-items: center; gap: 8px; padding: 6px 4px; flex-wrap: wrap; border-radius: 9px; }
.day-edit .field { flex: 1 1 160px; min-width: 0; padding: 6px 9px; }
.day-edit select.field { flex: 0 1 140px; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 4px 2px; }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; background: color-mix(in srgb, var(--danger) 9%, var(--surface)); border-radius: 9px; padding: 8px 10px; }
.prog-fields { display: grid; gap: 8px; width: 100%; }
.prog-fields label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.danger-zone { margin-top: 30px; }

/* ---------- session view ---------- */
.session-shell { display: grid; grid-template-columns: 1fr; min-height: calc(100vh - 54px); }
.rail { display: none; }
.rail-in { padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
.rail-in > * { min-width: 0; }
.rail-progress { display: grid; gap: 6px; font-size: 13px; }
.rail-week { padding: 10px 6px 6px; }
.rail-week h4 { margin: 0 8px 2px; font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.rail-week .sub { margin: 0 8px 6px; font-size: 12px; color: var(--muted); }
.rail-day { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border: 0; background: none; border-radius: 8px; text-align: left; }
.rail-day:hover { background: var(--surface-2); }
.rail-day[aria-current="true"] { background: var(--accent-soft); }
.rail-day .tile { width: 40px; height: 28px; font-size: 13px; }
.rail-day .nm { min-width: 0; flex: 1; font-size: 14px; line-height: 1.25; }
.rail-day .nm b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-day .nm small { color: var(--muted); font-size: 12px; }
.rail-day .mini { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; }
.rail-day .mini.on { background: var(--good); border-color: var(--good); color: var(--surface); }
.rail-day .mini svg { width: 10px; height: 10px; }
.drawer-scrim { position: fixed; inset: 0; background: rgba(10, 12, 14, .45); z-index: 40; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 88vw); background: var(--bg); z-index: 41; overflow-y: auto; border-right: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 960px) {
  .session-shell { grid-template-columns: 320px minmax(0, 1fr); }
  .session-shell.rail-hidden { grid-template-columns: 1fr; }
  .rail { display: block; border-right: 1px solid var(--line); background: var(--bg); }
  .session-shell.rail-hidden .rail { display: none; }
  .rail-in { position: sticky; top: calc(54px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 54px); overflow-y: auto; }
}
.session { min-width: 0; padding-inline: 16px; padding-block: 24px 80px; }
.session-in { max-width: 700px; margin: 0 auto; }
.session h1 { font-size: clamp(30px, 6vw, 42px); margin-bottom: 6px; }
.session-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-bottom: 22px; }
.block { padding-block: 18px; border-top: 1px solid var(--line); }
.block:first-of-type { border-top: 0; padding-top: 4px; }
.block h2 { font-family: var(--font-body); font-weight: 700; font-size: 17px; margin-bottom: 8px; }
.prose { font-size: 16.5px; line-height: 1.6; max-width: 65ch; overflow-wrap: anywhere; }
.prose p { margin: 0 0 10px; }
.prose h4 { margin: 14px 0 6px; font-size: 16px; }
.prose ul, .prose ol { margin: 0 0 10px; padding-left: 24px; }
.prose li { margin: 3px 0; }
.prose li > ul, .prose li > ol { margin: 4px 0 2px; }
.prose li.ghost { list-style: none; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.prose strong { font-weight: 700; }
.session-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; }
.nav-card { display: grid; gap: 2px; padding: 12px 14px; text-align: left; color: inherit; min-width: 0; }
.nav-card.next { text-align: right; }
.nav-card small { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nav-card b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-card:disabled { opacity: .45; cursor: default; }
.complete-big { width: 100%; justify-content: center; padding: 12px 16px; font-size: 16px; margin-top: 24px; }
.skeleton { height: 14px; border-radius: 6px; background: var(--surface-2); margin: 10px 0; }

/* block editor */
.blk-edit { padding: 12px; display: grid; gap: 8px; margin-bottom: 12px; }
.blk-edit .field.blk-title { font-weight: 700; }
.blk-edit textarea { min-height: 120px; resize: vertical; line-height: 1.5; font-size: 15.5px; overflow: hidden; }
.toolbar { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.toolbar .btn { padding: 4px 9px; font-size: 13px; }
.hint { font-size: 13px; color: var(--muted); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.status-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.status-switch button { border: 0; background: var(--surface); padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.status-switch button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }

/* home + tabs */
.topnav { display: none; gap: 2px; margin-left: 10px; }
.topnav button { border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.topnav button[aria-current="true"] { color: var(--fg); background: var(--surface-2); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar button { display: grid; justify-items: center; gap: 2px; border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 4px 22px; border-radius: 10px; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="true"] { color: var(--fg); }
.wrap.with-tabs { padding-bottom: 110px; }
@media (min-width: 720px) { .tabbar { display: none; } .topnav { display: flex; } .wrap.with-tabs { padding-bottom: 64px; } }
.home-min { max-width: 560px; }
.home-date { margin-block: 10px 18px; }
.home-date h1 { font-size: clamp(40px, 11vw, 56px); }
.hero { padding: 20px; display: grid; gap: 8px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hero-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 8vw, 36px); line-height: 1.05; }
.hero-sub { margin: 0; color: var(--muted); font-size: 15px; }
.hero-go { padding: 11px 20px; font-size: 16px; margin-top: 6px; }
.hero-actions { margin-top: 2px; }
.strip { margin-top: 24px; }
.strip-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.strip-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.sd { display: grid; justify-items: center; gap: 5px; padding: 9px 0 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: inherit; min-width: 0; }
.sd small { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.sd b { font-family: var(--font-display); font-size: 19px; line-height: 1; }
.sd .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.sd .dot.on { background: var(--good); border-color: var(--good); color: var(--surface); }
.sd .dot svg { width: 11px; height: 11px; }
.sd.next { border-color: var(--fg); }
.sd.today { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.sd.today small { color: var(--bg); }
.sd.today .dot { border-color: var(--bg); }
.sd.empty { opacity: .4; }
.mini-prog { margin-top: 24px; padding: 14px 16px; display: grid; gap: 8px; text-align: left; width: 100%; color: inherit; }
.mini-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; }
.lib-link { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: transparent; color: inherit; font-weight: 600; text-align: left; }
.lib-link svg { margin-left: auto; width: 16px; height: 16px; color: var(--muted); }
/* ---------- Circle-style shell ---------- */
.app-shell { min-height: 100vh; }
.side { display: none; }
.main-col { min-width: 0; }
@media (min-width: 900px) {
  .app-shell { display: grid; grid-template-columns: 276px minmax(0, 1fr); }
  .side { display: block; border-right: 1px solid var(--line); background: var(--bg); }
  .side-in { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 14px 10px 40px; display: grid; gap: 1px; align-content: start; }
  .brand.mob { display: none; }
  .mob-only { display: none !important; }
  .main-col .wrap { max-width: 860px; }
}
@media (max-width: 899px) { .wide-only { display: none !important; } }
.side-brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--fg); font-weight: 800; font-size: 20px; padding: 8px 10px 14px; letter-spacing: -.01em; }
.brand { font-family: var(--font-display); font-weight: 800; letter-spacing: -.01em; }
.sp-group { font-size: 13px; font-weight: 700; color: var(--fg); padding: 18px 10px 6px; }
.sp-row { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; color: var(--muted); text-align: left; padding: 8px 10px; border-radius: 10px; font-size: 15px; line-height: 1.3; }
.sp-row:hover { background: var(--surface-2); color: var(--fg); }
.sp-row.on { background: var(--surface-2); color: var(--fg); font-weight: 600; }
.sp-row.nav { color: var(--fg); font-weight: 600; }
.sp-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-pct { font-size: 12px; color: var(--muted); font-weight: 600; display: inline-grid; }
.sp-pct svg { width: 14px; height: 14px; color: var(--good); }
.badge { width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.badge.ic { background: none; border: 0; }
.badge.ic svg { width: 19px; height: 19px; }
.spaces .sp-row { padding: 12px 2px; font-size: 17px; }
.spaces .sp-group { font-size: 17px; padding: 22px 2px 4px; }
.apphead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }

<script>
(() => {
  "use strict";

  /* ---------- tiny helpers ---------- */
  const $app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const WEEKDAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  const PRESETS = ["Warm-Up", "Main Set", "Strength", "Cool-Down", "Notes"];

  const I = {
    mark: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.6"/><circle cx="8" cy="8" r=".6" fill="currentColor"/></svg>',

    up: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l5-5 5 5"/></svg>',
    down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l5 5 5-5"/></svg>',
    copy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="2"/><path d="M11 5V3a1 1 0 00-1-1H3a1 1 0 00-1 1v7a1 1 0 001 1h2"/></svg>',
    trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg>',

    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5L12 4l8.5 6.5V20a1 1 0 01-1 1h-5v-6h-5v6h-5a1 1 0 01-1-1z"/></svg>',
    grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>',
    flag: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14.5V2"/><path d="M3 2.5h8.5l-1.8 3 1.8 3H3"/></svg>',
    dots: '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/></svg>',
    menu: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></svg>',
    team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.7-3.2 3.1-5 6-5s5.3 1.8 6 5"/><path d="M15.5 5.6a3.2 3.2 0 0 1 0 6"/><path d="M17.5 14.7c1.8.6 3 2.3 3.5 4.8"/></svg>',
    download: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7.5 8 11l3.5-3.5M3 13.5h10"/></svg>',
  };

  /* ---------- state ---------- */
  const S = {
    status: "loading",          // loading | ready | nodb | error
    db: null, user: null, me: null,
    canEdit: false, progressWritable: true,
    edit: lsGet("bb.edit") === "1",
    programs: new Map(),        // pid -> program
    progress: new Map(),        // pid -> {did: ts}
    days: new Map(),            // `${pid}/${did}` -> {blocks:[...]} | undefined while loading
    daySub: null, daySubKey: "",
    route: { view: "home" },
    closedWeeks: new Set(JSON.parse(lsGet("bb.closed") || "[]")),
    confirm: "",                // key of the inline delete confirm that is open
    drawer: false,
    railHidden: lsGet("bb.rail") === "0",
    schedules: new Map(),       // pid -> this viewer's dated calendar for that program
    schedForm: "",              // pid whose date form is open
    sf: { anchor: "race", date: "" },
    itemMenu: "",               // schedule item whose Move panel is open
    loaded: new Set(),
    userLoaded: false,
    prefs: { current: "" },
    homeTab: "",                // "" = Calendar (the app always opens there) | "programs"
    jump: "today",              // after the next Calendar render: "today" scrolls to today, "restore" puts you back where you were
    homeScroll: null,
    backTo: "",                 // "home" when a session was opened from the Calendar
    search: { open: false, q: "" },
    showPast: false,
    noauto: new Map(),          // pid -> {key: ts}: sessions unticked by hand, never auto-ticked from Strava again
    progressReady: false,       // your ticks as the server has them (not a cached or failed load): auto-tick waits for this
    progExists: new Set(),      // pids whose progress doc exists on the server
    admin: false, isOwner: false, // admin = coach (Owner or Editor); canEdit is admin unless previewing as a member
    preview: (() => { try { return sessionStorage.getItem("aim.preview") === "1"; } catch (e) { return false; } })(), // this visit only: never hides your own calendar tomorrow
    profile: null,              // data/users/{me}/profile, null until you save one
    meView: null, meAsked: false, people: new Map(), peopleAsked: new Set(),
    draft: null, welcomed: false, progressErr: "",
    memberDoc: null, memberLoaded: false, memberWritable: true, memberChecked: false, joinSent: false,
    members: new Map(), membersOn: false, membersLoaded: false, membersErr: "",
    assign: null, assignOf: new Map(), assignOn: new Set(), hideAssign: 0, asAnchor: "start",
  };

  /* ---------- routing (#p.<pid>  #d.<pid>.<did>) ---------- */
  function parseRoute() {
    const parts = location.hash.replace(/^#/, "").split(".");
    if (parts[0] === "p" && parts[1]) return { view: "program", pid: parts[1] };
    if (parts[0] === "d" && parts[1] && parts[2]) return { view: "day", pid: parts[1], did: parts[2], base: parts[2].split("~")[0] };
    if (parts[0] === "library") { S.homeTab = "programs"; return { view: "home" }; }
    if (parts[0] === "progress") return { view: "progress", pid: parts[1] || "", week: +parts[2] || 0 };
    if (parts[0] === "you" || parts[0] === "team" || parts[0] === "welcome") return { view: parts[0] };
    if (parts[0] === "member" && parts[1]) return { view: "member", id: parts.slice(1).join(".") };
    return { view: "home" };
  }
  function go(hash) {
    if (location.hash === "#" + hash) { S.route = parseRoute(); syncDaySub(); render(); }
    else location.hash = hash;
  }
  window.addEventListener("hashchange", () => {
    if (S.route.view === "home" && homeTab() === "calendar") S.homeScroll = window.scrollY;
    S.route = parseRoute(); S.confirm = ""; S.drawer = false; S.itemMenu = ""; S.schedForm = ""; S.search.open = false;
    SV.perf.forEach((v, id) => { if (v && v.retryable) SV.perf.delete(id); });
    SV.streams.forEach((v, id) => { if (v && v.retryable) SV.streams.delete(id); });
    if (S.route.view === "home" && !S.jump) S.jump = S.homeScroll != null ? "restore" : "today";
    window.scrollTo(0, 0); syncDaySub(); render();
  });

  /* ---------- write queue: one write at a time per doc, coalesced ---------- */
  const W = new Map(); // path -> {timer, inflight, dirty, getData}
  function queueWrite(path, getData, delay = 500, mode = "set") {
    if (!S.db) return;
    let w = W.get(path);
    if (!w) { w = { timer: 0, inflight: false, dirty: false, getData, mode }; W.set(path, w); }
    else if (!w.dirty) w.mode = mode;                 // nothing pending: this write decides
    else if (mode === "set") w.mode = "set";          // a pending merge is covered by a full write of the local doc
    if (w.mode === mode) w.getData = getData;         // a merge never replaces a pending full write's data
    w.dirty = true;
    clearTimeout(w.timer);
    w.timer = setTimeout(() => flushWrite(path), delay);
    paintSaveState();
  }
  async function flushWrite(path, retried) {
    const w = W.get(path);
    if (!w || w.inflight || !w.dirty) return;
    w.inflight = true; w.dirty = false;
    const mode = w.mode; let ok = false;
    try { const ref = S.db.doc(path); await (mode === "update" ? ref.update(w.getData()) : ref.set(w.getData())); ok = true; }
    catch (e) {
      const code = e && e.code;
      if (code === "unavailable" && !retried) { w.inflight = false; w.dirty = true; setTimeout(() => flushWrite(path, true), 600 + Math.random() * 600); return; }
      writeError(path, code);
      if (code === "invalid_argument") PATCH.delete(path); // refused for good; anything else is kept and sent again later
    }
    w.inflight = false;
    const pre = S.me ? PATH.user() + "/prog_" : "";
    if (ok && mode === "set" && pre && path.startsWith(pre)) S.progExists.add(path.slice(pre.length)); // our own create: from now on ticks are merges
    if (w.dirty) { clearTimeout(w.timer); w.timer = setTimeout(() => flushWrite(path), 60); }
    else { W.delete(path); if (ok) PATCH.delete(path); }
    paintSaveState();
  }
  // a merge patch per doc: ticks send only the keys that changed, so a stale copy on another device can't erase anything
  const PATCH = new Map();
  const deepMerge = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object") deepMerge(a[k], b[k]); else a[k] = b[k]; } return a; };
  function queuePatch(path, patch, delay) { PATCH.set(path, deepMerge(PATCH.get(path) || {}, clone(patch))); queueWrite(path, () => clone(PATCH.get(path) || {}), delay, "update"); }
  const flushAll = () => { for (const [p, w] of W) { clearTimeout(w.timer); flushWrite(p); } };
  function resendPatches() { // ticks that didn't save go out again when the app comes back or the network does
    if (!S.progressWritable) return;
    for (const path of PATCH.keys()) if (!W.has(path)) queueWrite(path, () => clone(PATCH.get(path) || {}), 200, "update");
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); else resendPatches(); }); // iOS home-screen apps never fire beforeunload
  window.addEventListener("online", resendPatches);
  window.addEventListener("pagehide", flushAll);
  function cancelWrite(path) { const w = W.get(path); if (w) { clearTimeout(w.timer); W.delete(path); } }
  const busy = (path) => W.has(path);
  function writeError(path, code) {
    if (S.me && path === "members/" + S.me) { if (code === "invalid_argument") S.memberWritable = false; return; } // sharing with your coach is best-effort
    if (path.startsWith("data/users/")) {
      if (code === "invalid_argument") { S.progressWritable = false; toast("Your progress can't be saved with this access level."); render(); return; }
    }
    if (code === "invalid_argument") toast("This change wasn't saved. You can view this page but not edit it.");
    else if (code === "quota_exceeded") toast("Storage is full. Delete an old program to make room.");
    else if (code === "resource_exhausted") toast("Too many changes at once. Wait a moment and try again.");
    else toast("A change didn't save. Check your connection and try again.");
  }
  function paintSaveState() {
    const el = document.getElementById("save-state");
    if (!el) return;
    el.textContent = W.size ? "Saving…" : (S.edit ? "Saved" : "");
  }
  window.addEventListener("beforeunload", () => { for (const p of W.keys()) flushWrite(p); });

  /* ---------- data model ---------- */
  const COLS = ["programs", "library"];
  const colOf = (pid) => (S.programs.get(pid) || {}).col || "programs";
  const progPath = (pid) => colOf(pid) + "/" + pid;
  const dayPath = (pid, did) => progPath(pid) + "/days/" + did;

  /* ---------- people: roles, your athlete profile, and what your coach sees ----------
     Roles come from the server's roles table (coach) and signing in (athlete); aim-cloud.js reports them as the old access levels.
       coach   = admin (Owner or Editor): edits programs, sees the private library and the team
       athlete = saves their own progress (Contributor and up)
       viewer  = reads only
     Where it lives (SCHEMA.md has the full list):
       data/users/{me}/profile    your athlete profile, private to you
       members/{me}               what your coaches see: profile basics and plan progress (you write it, coaches read it)
       members/{me}/coach/plan    the program a coach assigned you (coaches write it, you read it)          */
  const PATH = {
    user: () => "data/users/" + S.me,
    prog: (pid) => PATH.user() + "/prog_" + pid,
    sched: (pid) => PATH.user() + "/sched_" + pid,
    profile: () => PATH.user() + "/profile",
    member: (id) => "members/" + id,
    assign: (id) => "members/" + id + "/coach/plan",
  };
  const AIM_VERSION = "21";
  const LEVELS = ["Beginner", "Intermediate", "Advanced", "Elite"];

      const wds = days.map((d) => WEEKDAYS.findIndex((x) => x.toLowerCase() === splitDay(d.name).wd.toLowerCase()));
      const byName = wds.every((x, i) => x >= 0 && (i === 0 || x >= wds[i - 1])); // two sessions on one weekday share that date
      days.forEach((d, j) => raw.push({ d, w, off: off + (byName ? wds[j] : j) }));
      off += Math.max(7, byName ? wds[wds.length - 1] + 1 : days.length);
    }
    if (!raw.length) return [];
    const rid = raceDayId(p), r = rid ? raw.find((x) => x.d.id === rid) : null;
    const base = anchor === "start" ? dnum(dateIso) : r ? dnum(dateIso) - r.off : dnum(dateIso) - lead - raw[raw.length - 1].off;
    return raw.map((x) => ({ k: x.d.id, did: x.d.id, w: x.w.id, rep: 0, date: diso(base + x.off) }));
  }
  const byDate = (a, b) => dnum(a.date) - dnum(b.date) || (a.rep - b.rep);
  function liveItems(p, s) { // items whose session still exists, joined to the template, in date order
    const live = new Map();
    p.weeks.forEach((w) => w.days.forEach((d) => { if (d.status === "published") live.set(d.id, { d, w }); }));
    return s.items.filter((x) => live.has(x.did)).map((x) => ({ ...x, n: dnum(x.date), day: live.get(x.did).d, week: live.get(x.did).w })).sort(byDate);

  function todayInfo(p) {
    const s = S.schedules.get(p.id);

    const isPost = (x) => !!rid && (x.did === rid || order.get(x.did) > order.get(rid)); // the race session itself, or recovery after it
    const pins = (s.races || []).filter((r) => r.k).map((r) => ({ n: dnum(r.date), k: r.k, d: r.k.split("~")[0] }));
    const late = (x) => (!isNaN(race) && x.n >= race && !isPost(x)) || pins.some((r) => x.k !== r.k && x.n >= r.n && order.get(x.did) < order.get(r.d));

      toRace: isNaN(race) ? null : race - t,

  function planDates(pid, anchor, v) { // a new calendar from a date, or the one you have slid to it so repeats, moves and skips survive
    const p = S.programs.get(pid), old = S.schedules.get(pid);
    if (old && old.items.length) {
      const s = clone(old);
      const ns = s.items.map((x) => dnum(x.date));
      const ri = raceDayId(p) && s.items.find((x) => x.did === raceDayId(p) && x.rep === 0);
      const delta = anchor === "race" ? (ri ? dnum(v) - dnum(ri.date) : (dnum(v) - s.lead) - Math.max(...ns)) : dnum(v) - Math.min(...ns);

    s.items.forEach((x) => { if (pinned.has(x.k) || !pred(x)) return; if (pid && (dnum(x.date) < t || isDone(pid, x.k))) return; x.date = diso(dnum(x.date) + delta); });

  function repeatWeek(pid, k) {
    const s = clone(S.schedules.get(pid)); const it = s.items.find((x) => x.k === k); if (!it) return;
    const group = s.items.filter((x) => x.w === it.w && x.rep === it.rep);
    const first = Math.min(...group.map((x) => dnum(x.date))), last = Math.max(...group.map((x) => dnum(x.date)));
    const span = Math.max(7, Math.ceil((last - first + 1) / 7) * 7);
    const rep = Math.max(...s.items.filter((x) => x.w === it.w).map((x) => x.rep)) + 1;
    const copies = group.map((x) => ({ k: x.did + "~" + rep, did: x.did, w: x.w, rep, date: x.date }));
    const t = todayNum(), movable = s.items.filter((x) => dnum(x.date) <= last && dnum(x.date) >= t && !isDone(pid, x.k));
    const back = s.anchor === "race" && movable.length > 0 && first >= t && movable.every((x) => dnum(x.date) - span >= t); // once you're into the plan, pulling weeks back would land them in the past

      copies.forEach((x) => { x.date = diso(dnum(x.date) + span); });
    }
    s.items.push(...copies);

  /* ---------- body text → HTML (lists, nesting, bold, links) ---------- */
  function inline(s) {
    const links = [];
    const held = String(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => { links.push([t, u]); return "\u0000" + (links.length - 1) + "\u0000"; });
    let h = esc(held);
    h = h.replace(/(https?:\/\/[^\s<\u0000]+[^\s<.,;:!?)\u0000])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    h = h.replace(/\u0000(\d+)\u0000/g, (m, i) => '<a href="' + esc(links[i][1]) + '" target="_blank" rel="noopener noreferrer">' + esc(links[i][0]) + "</a>");
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/(^|[^*\w])\*(\S(?:[^*]*?\S)?)\*(?![*\w])/g, "$1<em>$2</em>");
    return h;
  }
  function renderBody(src) {
    const lines = String(src || "").replace(/\r/g, "").split("\n");
    let html = ""; const stack = []; let para = [];
    const flushPara = () => { if (para.length) { html += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
    const closeTo = (n) => { while (stack.length > n) html += "</li></" + stack.pop() + ">"; };
    for (const raw of lines) {
      const line = raw.replace(/\t/g, "  ");
      const m = line.match(/^(\s*)([-*•]|\d+[.)])\s+(.*)$/);
      if (m) {
        flushPara();
        const level = Math.min(4, Math.floor(m[1].length / 2));
        const type = /\d/.test(m[2]) ? "ol" : "ul";
        if (stack.length > level + 1) closeTo(level + 1);
        if (stack.length === level + 1) {
          if (stack[level] !== type) closeTo(level); else html += "</li>";
        }
        while (stack.length < level + 1) {
          const t = stack.length === level ? type : "ul";
          const start = t === "ol" ? parseInt(m[2], 10) : 1;
          html += t === "ol" ? (start > 1 ? '<ol start="' + start + '">' : "<ol>") : "<ul>";
          stack.push(t);
          if (stack.length < level + 1) html += '<li class="ghost">';
        }
        html += "<li>" + inline(m[3]);
        continue;
      }
      if (!line.trim()) { flushPara(); closeTo(0); continue; }
      if (stack.length && /^\s+\S/.test(line)) { html += "<br>" + inline(line.trim()); continue; }
      closeTo(0);
      if (/^\s*(-{3,}|_{3,})\s*$/.test(line)) { flushPara(); html += "<hr>"; continue; }
      const hm = line.match(/^\s*#{1,4}\s+(.*)$/);
      if (hm) { flushPara(); html += "<h4>" + inline(hm[1]) + "</h4>"; continue; }
      para.push(line.trim());
    }
    flushPara(); closeTo(0);
    return html;
  }

  /* ----- progress: one plan week by week against what you did (the iPhone's Progress tab, AIM/Logic/Report.swift, on the web) -----
     The same counting as the iPhone's Progress tab (AIM/Logic/Report.swift): from ticks and workouts, no AI, no guesses. */
  const RV = { all: false, days: new Map() };
  window.aimProgressRange = (all) => { RV.all = !!all; render(); };
  const RV_LABEL = { long: "Long runs", steady: "Steady runs", easy: "Easy runs", intervals: "Interval runs", tempo: "Tempo runs", otherRun: "Other runs",
    strength: "Strength", hyrox: "HYROX", race: "Races", other: "Other sessions" };
  const RV_ORDER = Object.keys(RV_LABEL);
  const RV_SPEED = ["intervals", "tempo", "steady"]; // the pace metric is about speed work
  const RV_TOL = 10;     // a rep is on target up to 10 s/mi slower: the watch's pace-alert band for work steps
  const RV_SHARE = 0.75; // a week counts toward consistency at 3 in 4 sessions done
  const I_CHART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>';

  function rvKind(x, info) { // a session's type from its name, like "Long Run: 10 Miles"; rest days have none
    if ((x.did === info.rid && x.rep === 0 && x.n === info.race) || info.races.some((r) => r.n === x.n && RACE_RE.test(x.day.name))) return "race";
    if (x.day.kind === "rest" || isRest(x.day.name)) return null;
    const s = splitDay(x.day.name).rest.toLowerCase();
    if (x.day.kind === "gym") return /hyrox|sled|wall ?balls?|roxzone|\bsim\b/.test(s) ? "hyrox" : "strength";
    if (x.day.kind !== "run") return "other";
    if (s.includes("long")) return "long";
    if (s.includes("tempo") || s.includes("threshold")) return "tempo";
    if (s.includes("steady") || s.includes("progression")) return "steady";
    if (s.includes("easy") || s.includes("recovery") || s.includes("shakeout")) return "easy";
    return /interval|fartlek|hills?\b|repeats?\b|\d\s*[x×]\s*\d|^the /.test(s) ? "intervals" : "otherRun";
  }

  function rvBuild(p) {
    const info = todayInfo(p);
    if (!info || !info.items.length) return null;
    const first = info.items[0].n, last = info.items[info.items.length - 1].n, weeks = [];
    for (let wk = first - dow(first), i = 1; wk <= last - dow(last); wk += 7, i++) {
      const sessions = info.items.filter((x) => x.n >= wk && x.n < wk + 7).map((x) => {
        const kind = rvKind(x, info);
        return kind && { x, kind, done: isDone(p.id, x.k), act: matchOf(p.id, x.k) || null, mi: x.day.kind === "run" ? +x.day.dist || 0 : 0 };
      }).filter(Boolean);
      let rec = 0; // every run recorded that week, plus a ticked run's planned miles when no watch has it
      for (let n = wk; n < wk + 7; n++) (SV.byDay.get(n) || []).forEach((a) => { if (actKind(a) === "run") rec += a.dist; });
      const ticked = sessions.filter((s) => s.done && !s.act).reduce((a, s) => a + s.mi, 0);
      weeks.push({ i, start: wk, end: wk + 6, sessions, doneMi: rec / 1609.344 + ticked, planMi: sessions.reduce((a, s) => a + s.mi, 0),
        planned: sessions.length, done: sessions.filter((s) => s.done).length });
    }
    return { p, info, t: info.t, weeks };
  }
  const rvCurrent = (R) => R.weeks.find((w) => w.start <= R.t && R.t <= w.end) || null;
  const rvFinished = (R) => R.weeks.filter((w) => w.end < R.t).length;
  const rvMark = (R, w) => (w.start > R.t ? "upcoming" : w.end >= R.t ? "current" : w.done >= w.planned ? "full" : w.done ? "partial" : "missed");
  const rvWindow = (R, i, last) => R.weeks.filter((w) => w.i <= i && (!last || w.i > i - last) && w.start <= R.t);
  const rvDue = (R, s) => s.x.n < R.t || s.done; // only what's due counts: days before today, and anything already done
  function rvTotals(R, ws) {
    const o = { planned: 0, done: 0, planMi: 0, doneMi: 0 };
    ws.forEach((w) => { w.sessions.forEach((s) => { if (rvDue(R, s)) { o.planned++; o.planMi += s.mi; if (s.done) o.done++; } }); o.doneMi += w.doneMi; });
    o.completion = o.planned ? o.done / o.planned : null; o.volume = o.planMi ? o.doneMi / o.planMi : null;
    return o;
  }
  function rvByKind(R, i) {
    const m = new Map();
    rvWindow(R, i).forEach((w) => w.sessions.forEach((s) => {
      if (!rvDue(R, s)) return;

    }));

  }
  function rvConsistency(R) { // of the last four finished weeks that had sessions, how many you did 3 in 4 of
    const last = R.weeks.filter((w) => w.end < R.t && w.planned).slice(-4);

  }
  function rvDay(pid, did) { // a session's workout, for its steps; loads in the background and redraws
    const base = did.split("~")[0], key = pid + "/" + base;
    if (S.days.has(key)) return S.days.get(key);
    const d = RV.days.get(key);
    if (d) return d === "loading" ? null : d;
    if (!S.db) return null;
    RV.days.set(key, "loading");
    S.db.doc(dayPath(pid, base)).get().then((s) => { RV.days.set(key, s.exists ? normDay(s.data()) : { blocks: [] }); render(); },
      () => RV.days.set(key, { blocks: [] }));

  // pieces

  /* ----- home ----- */

    }
    return best || progOf(S.prefs.current) || null;
  }
  function agendaView() {
    if (!S.loaded.has("library") || !S.userLoaded) return `<div class="skeleton" style="margin-top:12px"></div><div class="skeleton" style="width:70%"></div>`;
    const plans = datedPlans(), t = todayNum();
    if (!plans.length) {
      return `<div id="ag-ready"></div>${assignCard()}${upNextRow(lastWorked())}
        <div class="empty"><h2>Nothing on your calendar yet</h2><p>${S.canEdit ? "Open a program and add your race day or start date. Its sessions show up here, day by day." : S.progressWritable ? "Your coach adds your plan here. You can also open a program and set its dates. Its sessions show up here, day by day." : "You can browse the programs. Saving a plan and ticks needs member access from your coach."}</p>
        <button class="btn" data-act="home-tab" data-v="programs">${I.grid}Programs</button></div>`;
    }
    const byDay = new Map(), put = (n, e) => { if (!byDay.has(n)) byDay.set(n, []); byDay.get(n).push(e); };
    plans.forEach((pl, pi) => {
      pl.info.items.forEach((x) => put(x.n, { pl, pi, x }));
      if (!isNaN(pl.info.race) && !(pl.info.raceItem && pl.info.raceItem.n === pl.info.race)) put(pl.info.race, { pl, pi, x: null });
      pl.info.races.forEach((r) => { if (!pl.info.items.some((x) => x.n === r.n && RACE_RE.test(x.day.name))) put(r.n, { pl, pi, x: null, race: r.name }); });
    });
    const after = (e) => (isNaN(e.pl.info.race) ? 1 : 0); // within a day, a race plan's session (the run) is listed before add-on plans stacked after it
    const ns = [...byDay.keys()], lo = Math.min(...ns), hi = Math.max(...ns);
    const firstWk = lo - dow(lo), lastWk = hi - dow(hi), nowWk = t - dow(t);

    const pins = cds.map((c) => `<span class="cd"><b class="tnum">${c.d === 0 ? "Race day" : c.d + "d"}</b> ${esc(c.name)}</span>`).join("");
    const shown = new Set(); byDay.forEach((es, n) => { if (n >= from) es.forEach((e) => shown.add(e.pi)); });
    const solo = shown.size === 1; // only one plan in the weeks shown: rows don't need its name
    let h = `<div class="ag-pin"><span class="ag-cds">${pins || `<span class="cd">${esc(fmt(t, { weekday: "long", month: "short", day: "numeric" }))}</span>`}</span>
      <button class="btn sm off" id="ag-jump" data-act="cal-today">Today</button></div>${stravaNote()}`;
    if (from > firstWk) h += `<button class="btn sm ghost ag-past" data-act="show-past">${I.up}Show earlier weeks</button>`;
    else if (S.showPast && nowWk > firstWk) h += `<button class="btn sm ghost ag-past" data-act="show-past">${I.down}Hide earlier weeks</button>`;
    let gap = null; // weeks with nothing planned yet collapse into one line
    const flushGap = (end) => { if (gap != null) h += `<div class="ag-gap tnum">${esc(fmt(gap, { month: "short", day: "numeric" }))} – ${esc(fmt(end, { month: "short", day: "numeric" }))} · nothing planned yet</div>`; gap = null; };
    for (let wk = from; wk <= lastWk; wk += 7) {
      let any = false; for (let n = wk; n < wk + 7; n++) if (byDay.has(n)) any = true;
      if (!any && !(t >= wk && t < wk + 7)) { if (gap == null) gap = wk; continue; }
      flushGap(wk - 1);
      const sameMonth = new Date(wk * DAY).getUTCMonth() === new Date((wk + 6) * DAY).getUTCMonth();
      const wset = new Map(); for (let n = wk; n < wk + 7; n++) (byDay.get(n) || []).forEach((y) => { if (y.x) wset.set(y.x.w + "~" + y.x.rep, y.x.week.name + (y.x.rep ? " repeat" : "")); });
